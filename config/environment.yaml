apiVersion: strata.huybrechts.xyz/v1
kind: environment
meta:
  name: haven_env_prd
  annotations:
    description: Production environment for the family platform on Hetzner
  labels:
    version: "1.0.0"
  tags: [haven, hetzner, family, production]
spec:
  secrets:
    # Infrastructure — Hetzner
    - key: HETZNER_API_TOKEN
      store: infisical
      value: HETZNER_API_TOKEN
      description: Hetzner Cloud project API token
    - key: HETZNER_PRIVATE_KEY
      store: infisical
      value: HETZNER_PRIVATE_KEY
      description: Hetzner SSH deployment key (private, ed25519)
    - key: HEARTH_SSH_PRIVATE_KEY
      store: infisical
      value: HETZNER_PRIVATE_KEY
      description: Same value as HETZNER_PRIVATE_KEY — satisfies deploy/terraform/variables.tf's separate (legacy) required variable of this name without duplicating the key in Infisical
    - key: HETZNER_PUBLIC_KEY
      store: infisical
      value: HETZNER_PUBLIC_KEY
      description: Hetzner SSH deployment key (public, ed25519)
    - key: HETZNER_ROOT_PASSWORD
      store: infisical
      value: HETZNER_ROOT_PASSWORD
      description: Initial root access password
      generate:
        type: urlsafe
        length: 32

    # Infrastructure — Hetzner Storage Box
    # Two physical Storage Boxes: `haven-backup` (BorgBackup repos only, one
    # sub-account per VM) and `haven-data` (live app data, sub-accounts split
    # by content type — media for Immich/Jellyfin, docs for Nextcloud/Kavita).
    - key: STORAGEBOX_BACKUP_HEARTH_PASSWORD
      store: infisical
      value: STORAGEBOX_BACKUP_HEARTH_PASSWORD
      description: haven-backup Storage Box sub-account password for Hearth's BorgBackup repo
    - key: STORAGEBOX_BACKUP_FORGE_PASSWORD
      store: infisical
      value: STORAGEBOX_BACKUP_FORGE_PASSWORD
      description: haven-backup Storage Box sub-account password for Forge's BorgBackup repo
    - key: STORAGEBOX_DATA_MEDIA_PASSWORD
      store: infisical
      value: STORAGEBOX_DATA_MEDIA_PASSWORD
      description: haven-data Storage Box sub-account password for the media share (Immich + Jellyfin), SMB-mounted on Forge
    - key: STORAGEBOX_DATA_DOCS_PASSWORD
      store: infisical
      value: STORAGEBOX_DATA_DOCS_PASSWORD
      description: haven-data Storage Box sub-account password for the docs share (Nextcloud + Kavita), SMB-mounted on Forge

    # Infrastructure — Portainer Kubernetes Edge Agent (Forge)
    # Edge ID/key come from Portainer's own "Add environment > Kubernetes >
    # Edge Agent" wizard (Environments UI) — a one-time registration
    # credential tied to that specific environment slot, not something
    # strata/Ansible generates. Set these via `strata secret put` (or the
    # Infisical dashboard directly) once you've created the environment.
    - key: PORTAINER_EDGE_ID
      store: infisical
      value: PORTAINER_EDGE_ID
      description: Portainer Edge Agent ID for Forge's Kubernetes environment
    - key: PORTAINER_EDGE_KEY
      store: infisical
      value: PORTAINER_EDGE_KEY
      description: Portainer Edge Agent key for Forge's Kubernetes environment

    # Infrastructure — BorgBackup
    - key: BORG_PASSPHRASE_HEARTH
      store: infisical
      value: BORG_PASSPHRASE_HEARTH
      description: BorgBackup encryption passphrase — Hearth archive
      generate:
        type: urlsafe
        length: 48
    - key: BORG_PASSPHRASE_FORGE
      store: infisical
      value: BORG_PASSPHRASE_FORGE
      description: BorgBackup encryption passphrase — Forge archive
      generate:
        type: urlsafe
        length: 48

    # Infrastructure — Healthchecks.io
    - key: HEALTHCHECK_PING_HEARTH
      store: infisical
      value: HEALTHCHECK_PING_HEARTH
      description: Healthchecks.io ping URL for Hearth backup monitoring

    # Application secrets — Authentik
    - key: AUTHENTIK_SECRET_KEY
      store: infisical
      value: AUTHENTIK_SECRET_KEY
      description: Authentik internal encryption key (session signing)
      generate:
        type: urlsafe
        length: 64
    - key: AUTHENTIK_POSTGRESQL__PASSWORD
      store: infisical
      value: AUTHENTIK_POSTGRESQL__PASSWORD
      description: PostgreSQL password for Authentik database
      generate:
        type: urlsafe
        length: 48
    # Infomaniak SMTP — reusable across services (Authentik, and any future service needing outbound email)
    - key: INFOMANIAK_EMAIL__HOST
      store: infisical
      value: INFOMANIAK_EMAIL__HOST
      description: Infomaniak SMTP host (reusable — shared by any service needing outbound email)
    - key: INFOMANIAK_EMAIL__PORT
      store: infisical
      value: INFOMANIAK_EMAIL__PORT
      description: Infomaniak SMTP port (reusable — shared by any service needing outbound email)
    - key: INFOMANIAK_EMAIL__USERNAME
      store: infisical
      value: INFOMANIAK_EMAIL__USERNAME
      description: Infomaniak SMTP username (reusable — shared by any service needing outbound email; enable in Authentik after Infomaniak migration)
    - key: INFOMANIAK_EMAIL__PASSWORD
      store: infisical
      value: INFOMANIAK_EMAIL__PASSWORD
      description: Infomaniak SMTP password (reusable — shared by any service needing outbound email; enable in Authentik after Infomaniak migration)

    # Application secrets — Vaultwarden
    - key: VAULTWARDEN_ADMIN_TOKEN
      store: infisical
      value: VAULTWARDEN_ADMIN_TOKEN
      description: Vaultwarden admin token (raw/unsigned) — the Argon2 hash Vaultwarden actually needs is stored separately as VAULTWARDEN_ADMIN_ARGON
      generate:
        type: urlsafe
        length: 48
    - key: VAULTWARDEN_ADMIN_ARGON
      store: infisical
      value: VAULTWARDEN_ADMIN_ARGON
      description: Vaultwarden admin token (Argon2 hash of VAULTWARDEN_ADMIN_TOKEN) — precomputed via scripts/hash_argon2.py and stored directly; no generate spec (derived value, not random)
    - key: VAULTWARDEN_SSO_CLIENT_SECRET
      store: infisical
      value: VAULTWARDEN_SSO_CLIENT_SECRET
      description: OIDC client secret for Vaultwarden SSO via Authentik
      generate:
        type: urlsafe
        length: 48

    # Application secrets — WUD
    - key: WUD_SSO_CLIENT_SECRET
      store: infisical
      value: WUD_SSO_CLIENT_SECRET
      description: OIDC client secret for WUD SSO via Authentik
      generate:
        type: urlsafe
        length: 48

    # Application secrets — Jellyfin (Forge)
    - key: JELLYFIN_SSO_CLIENT_SECRET
      store: infisical
      value: JELLYFIN_SSO_CLIENT_SECRET
      description: OIDC client secret for Jellyfin SSO via Authentik (K0lin/jellyfin-plugin-sso)
      generate:
        type: urlsafe
        length: 48
    # Jellyfin admin API key — like PORTAINER_EDGE_ID/KEY above, this is a
    # literal credential generated BY Jellyfin itself (Dashboard -> API Keys,
    # one-time, after the first-run admin setup wizard has been completed via
    # the web UI — Jellyfin has no headless bootstrap), not something we
    # generate. Used by deploy-forge-deploy.yml to idempotently (re-)register
    # the Authentik OIDC provider with the SSO plugin on every deploy. Set via
    # `strata secret put JELLYFIN_API_KEY --value "..." -f config/environment.yaml`.
    - key: JELLYFIN_API_KEY
      store: infisical
      value: JELLYFIN_API_KEY
      description: Jellyfin admin API key, used to register the Authentik SSO provider via the K0lin/jellyfin-plugin-sso REST API

    # Application secrets — Immich (Forge)
    - key: IMMICH_DB_PASSWORD
      store: infisical
      value: IMMICH_DB_PASSWORD
      description: PostgreSQL password for Immich's database (vectorchord-enabled Postgres on Forge)
      generate:
        type: urlsafe
        length: 48
    - key: IMMICH_SSO_CLIENT_SECRET
      store: infisical
      value: IMMICH_SSO_CLIENT_SECRET
      description: OIDC client secret for Immich SSO via Authentik
      generate:
        type: urlsafe
        length: 48

    # Application secrets — Nextcloud (Forge)
    - key: NEXTCLOUD_ADMIN_PASSWORD
      store: infisical
      value: NEXTCLOUD_ADMIN_PASSWORD
      description: Nextcloud initial admin account password (auto-configured at container startup)
      generate:
        type: urlsafe
        length: 48
    - key: NEXTCLOUD_DB_PASSWORD
      store: infisical
      value: NEXTCLOUD_DB_PASSWORD
      description: PostgreSQL password for Nextcloud's database
      generate:
        type: urlsafe
        length: 48
    - key: NEXTCLOUD_REDIS_PASSWORD
      store: infisical
      value: NEXTCLOUD_REDIS_PASSWORD
      description: Redis password for Nextcloud memory caching + file locking
      generate:
        type: urlsafe
        length: 48
    - key: NEXTCLOUD_SSO_CLIENT_SECRET
      store: infisical
      value: NEXTCLOUD_SSO_CLIENT_SECRET
      description: OIDC client secret for Nextcloud SSO via Authentik (user_oidc app)
      generate:
        type: urlsafe
        length: 48

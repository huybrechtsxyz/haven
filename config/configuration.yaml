apiVersion: strata.huybrechts.xyz/v2
kind: configuration
meta:
  name: haven
  annotations:
    description: Haven family platform configuration - Hetzner Hearth (Docker Compose) + Forge (k3s)
  tags: [haven, hetzner, configuration, family]
spec:
  # Provider type registry: names of `providerconfig` documents (config/registry/).
  providers:
    - hetzner

  # Topology type registry: names of `topologyconfig` documents (config/registry/).
  additional_topologies: false
  topologies:
    - compose # Hearth: one VM running Docker Compose
    - k3s     # Forge: one VM running k3s

  security:
    # Every secret lives in Infisical; refuse any other store in an environment.
    allowed_secret_stores:
      - infisical

apiVersion: strata.huybrechts.xyz/v1
kind: workspace
meta:
  name: haven_platform
  annotations:
    description: Family platform workspace — Hearth VPS (Docker Compose) + Forge VPS (k3s) on Hetzner
  labels:
    version: "1.0.0"
  tags: [haven, hetzner, platform, family]
spec:
  providers:
    - name: hetzner_dc_eu_de
      file: "config/providers/hetzner-eu-de.yaml"

  provisioners:
    - name: haven_iac
      provisioner: terraform
      source:
        repository: haven
        source_path: deploy/terraform
        target_path: terraform

  namespaces:
    - name: hearth
      file: config/hearth/namespace.yaml

  topology:
    - name: hetzner_hearth
      provider: hetzner_dc_eu_de
      provisioner: haven_iac
      type: single_node # Docker Compose — Caddy, Authentik, Vaultwarden, Portainer, WUD
      namespaces:
        - namespace: hearth
      volumes:
        - name: config
          type: local
        - name: data
          type: local
        - name: logs
          type: local
        - name: certs
          type: local
      components:
        - resource: haven_vm_hetzner_hearth

    - name: hetzner_forge
      provider: hetzner_dc_eu_de
      provisioner: haven_iac
      type: single_node # k3s — Immich, Jellyfin, Gatus, home apps
      volumes:
        - name: k3s
          type: local
        - name: data
          type: local
        - name: media
          type: local # NFS mount managed by Ansible (Hetzner Storage Box)
      components:
        - resource: haven_vm_hetzner_forge

  resources:
    - name: haven_vm_hetzner_hearth
      file: "config/hearth/vm.yaml"
      role: node
      count: 1
      firewalls:
        - haven_fw_hetzner_hearth

    - name: haven_vm_hetzner_forge
      file: "config/forge/vm.yaml"
      role: node
      count: 1
      firewalls:
        - haven_fw_hetzner_forge

  firewalls:
    - name: haven_fw_hetzner_hearth
      file: "config/hearth/firewall.yaml"

    - name: haven_fw_hetzner_forge
      file: "config/forge/firewall.yaml"

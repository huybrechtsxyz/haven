apiVersion: strata.huybrechts.xyz/v1
kind: workspace
meta:
  name: haven_platform
  annotations:
    description: Family platform workspace — Hearth VPS (Docker Compose) + Forge VPS (k3s) on Hetzner
  labels:
    version: "1.0.0"
  tags: [haven, hetzner, platform, family]
spec:
  providers:
    - name: hetzner_dc_eu_de
      file: "config/providers/hetzner-eu-de.yaml"

  provisioners:
    - name: haven_iac
      provisioner: terraform
      source:
        repository: haven
        source_path: deploy/terraform
        target_path: terraform

    - name: haven_helm
      provisioner: helm
      description: Deploys Helm modules declared in Forge's k3s namespaces (immich, media, system, documents).
      source:
        # Required by the model for non-sync provisioner types, but functionally
        # unused here — each module (config/forge/modules/*.yaml) declares its
        # own chart source (OCI, HTTP repo, or local chart path). This just
        # needs to point somewhere valid.
        repository: haven
        source_path: services/forge

  # STEP-BY-STEP ACTIVATION: strata's Helm deployer has no per-stage namespace
  # filter (unlike the argocd/flux sync provisioners) — it discovers every
  # namespace listed below and deploys all of their Helm modules in one pass.
  # To try out Forge services one at a time, only one forge namespace is
  # active below. Once it's verified, uncomment the next one and re-run
  # `strata deploy run --stage applications_forge`.
  namespaces:
    - name: hearth
      file: config/hearth/namespace.yaml
    - name: system
      file: config/forge/namespaces/system.yaml # 1st — rclone-mount (documents' shared storage depends on it)
    - name: immich
      file: config/forge/namespaces/immich.yaml # 2nd — self-contained, no shared-storage dependency
    - name: media
      file: config/forge/namespaces/media.yaml # 3rd — self-contained, no shared-storage dependency
    - name: documents
      file: config/forge/namespaces/documents.yaml # 4th — needs 'system' (rclone-mount) deployed first

  topology:
    - name: hetzner_hearth
      provider: hetzner_dc_eu_de
      provisioner: haven_iac
      type: single_node # Docker Compose — Caddy, Authentik, Vaultwarden, Portainer, WUD
      namespaces:
        - namespace: hearth
      volumes:
        - name: config
          type: local
        - name: data
          type: local
        - name: logs
          type: local
        - name: certs
          type: local
      components:
        - resource: haven_vm_hetzner_hearth

    - name: hetzner_forge
      provider: hetzner_dc_eu_de
      provisioner: haven_iac
      type: single_node # k3s — one k8s namespace per app group (immich, media, documents; system for cross-cutting tooling; apps namespace later)
      # Kept in lockstep with spec.namespaces above — uncomment each entry
      # together with its spec.namespaces counterpart as services are activated.
      namespaces:
        - namespace: system
        - namespace: immich
        - namespace: media
        - namespace: documents
      volumes:
        - name: k3s
          type: local
        - name: data
          type: local
        - name: media
          type: local # SMB mount managed by Ansible (Hetzner Storage Box)
      components:
        - resource: haven_vm_hetzner_forge

  resources:
    - name: haven_vm_hetzner_hearth
      file: "config/hearth/vm.yaml"
      role: node
      count: 1
      firewalls:
        - haven_fw_hetzner_hearth

    - name: haven_vm_hetzner_forge
      file: "config/forge/vm.yaml"
      role: node
      count: 1
      firewalls:
        - haven_fw_hetzner_forge

  firewalls:
    - name: haven_fw_hetzner_hearth
      file: "config/hearth/firewall.yaml"

    - name: haven_fw_hetzner_forge
      file: "config/forge/firewall.yaml"

apiVersion: strata.huybrechts.xyz/v2
kind: module
meta:
  name: portainer
  annotations:
    description: Portainer CE - Docker container management UI with console access
  tags: [haven, hearth, portainer, management, console]
spec:
  type: compose
  source:
    # No files of its own: only the Compose service below is rendered (the
    # namespace's merged docker-compose.yml). strata needs an existing path.
    source_path: services/hearth
  services:
    - name: portainer
      image: portainer/portainer-ce:2.39.3-alpine
      restart: unless-stopped
      command: ["--http-disabled"]
      # Edge tunnel port for Kubernetes/Docker Edge Agents (Forge) - NOT proxied
      # by Caddy (raw tunnel protocol, not plain HTTP); published directly to
      # the host and allowed through Hearth's firewall from the private
      # network only (10.0.0.0/8, see config/hearth/firewall.yaml).
      ports:
        - "8000:8000"
      environment:
        - key: TZ
          value: Europe/Brussels
        - key: TRUSTED_ORIGINS
          value: portainer.huybrechts.xyz
      mounts:
        - name: data
          type: bind
          source_path: /opt/haven/var/data/portainer
          target_path: /data
        - name: docker-socket
          type: bind
          source_path: /var/run/docker.sock
          target_path: /var/run/docker.sock

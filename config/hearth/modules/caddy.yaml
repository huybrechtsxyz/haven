apiVersion: strata.huybrechts.xyz/v2
kind: module
meta:
  name: caddy
  annotations:
    description: Caddy 2 reverse proxy - terminates TLS for all Hearth services via ACME
  tags: [haven, hearth, caddy, proxy, tls, acme]
spec:
  type: compose
  source:
    source_path: services/hearth/caddy
  services:
    - name: caddy
      image: caddy:2-alpine
      restart: unless-stopped
      ports:
        - "80:80"
        - "443:443"
        - "443:443/udp" # HTTP/3 QUIC
      mounts:
        - name: caddyfile
          type: bind
          source_path: /opt/haven/etc/caddy/Caddyfile
          target_path: /etc/caddy/Caddyfile
          chmod: "0644"
        - name: data
          type: bind
          source_path: /opt/haven/var/certs
          target_path: /data
        - name: config
          type: bind
          source_path: /opt/haven/etc/caddy/config
          target_path: /config
      # Merged verbatim into the Compose service entry.
      configuration:
        networks:
          default:
            aliases:
              - auth.huybrechts.xyz
              - wud.huybrechts.xyz
              - vault.huybrechts.xyz
              - portainer.huybrechts.xyz

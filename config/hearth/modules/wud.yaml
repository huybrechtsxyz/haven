apiVersion: strata.huybrechts.xyz/v2
kind: module
meta:
  name: wud
  annotations:
    description: What's Up Docker - container image update notifications with web UI
  tags: [haven, hearth, wud, monitoring, updates]
spec:
  type: compose
  source:
    # No files of its own: only the Compose service below is rendered (the
    # namespace's merged docker-compose.yml). strata needs an existing path.
    source_path: services/hearth
  services:
    - name: wud
      image: fmartinou/whats-up-docker:6.6.1
      restart: unless-stopped
      # Wait for Authentik to be *healthy*, not just started. Done through
      # `configuration` (merged verbatim into the Compose entry) because the
      # native `depends_on: ["@authentik/server"]` renders a plain list
      # without a condition.
      configuration:
        depends_on:
          authentik-server:
            condition: service_healthy
      environment:
        - key: TZ
          value: Europe/Brussels
        - key: WUD_WATCHER_LOCAL_WATCHBYDEFAULT
          value: "true"
        - key: WUD_PUBLIC_URL
          value: https://wud.huybrechts.xyz
        - key: WUD_AUTH_OIDC_AUTHENTIK_CLIENTID
          value: wud
        - key: WUD_AUTH_OIDC_AUTHENTIK_CLIENTSECRET
          value: "${secret:WUD_SSO_CLIENT_SECRET}"
        - key: WUD_AUTH_OIDC_AUTHENTIK_DISCOVERY
          value: https://auth.huybrechts.xyz/application/o/wud/.well-known/openid-configuration
        - key: WUD_AUTH_OIDC_AUTHENTIK_REDIRECT
          value: "true"
      mounts:
        - name: docker-socket
          type: bind
          source_path: /var/run/docker.sock
          target_path: /var/run/docker.sock

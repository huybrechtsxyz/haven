apiVersion: strata.huybrechts.xyz/v2
kind: resource
meta:
  name: hearth-vm
  annotations:
    description: Hetzner CX23 - Hearth VPS (Docker Compose - Caddy, Authentik, Vaultwarden, Portainer, WUD)
  tags: [haven, hetzner, vm, hearth, family]
spec:
  provider_type: hetzner
  resource_type: virtualmachine
  category: compute
  subcategory: virtualmachine
  unit_cost: 4.15 # EUR per month (CX23)
  configuration:
    image: ubuntu-24.04
    server_type: cx23
    location: nbg1
  storage:
    install_path: /opt/haven
    volumes:
      - name: config
        path: /opt/haven/etc
      - name: data
        path: /opt/haven/var/data
      - name: logs
        path: /opt/haven/var/logs
      - name: certs
        path: /opt/haven/var/certs # Caddy ACME storage

  labels:
    version: "1.0.0"
  tags: [haven, forge, gaming, k3s, foundryvtt]
spec:
  modules:
    - name: foundryvtt-secrets
      description: K8s Secret holding FoundryVTT's real foundryvtt.com account credentials and admin key
      file: config/forge/modules/foundryvtt-secrets.yaml
    - name: foundryvtt
      description: Foundry Virtual Tabletop — self-hosted VTT server
      file: config/forge/modules/foundryvtt.yaml

apiVersion: strata.huybrechts.xyz/v2
kind: namespace
meta:
  name: finance
  annotations:
    description: Family personal finance tracking (k3s on Forge) — Firefly III, backed by its own PostgreSQL. SSO via Traefik forwardAuth -> Authentik (not native OIDC, see docs/services/firefly.md) — first use of this SSO pattern in the repo, not yet live-verified.
  tags: [haven, forge, finance, k3s, family]
spec:
  modules:
    - name: firefly-postgres
      description: PostgreSQL for Firefly III
      module: firefly-postgres
    - name: firefly
      description: Personal finance manager — budgets, transactions, recurring bills
      module: firefly
    - name: firefly-importer
      description: Imports CSV/camt.053 bank statement files into Firefly III — web UI for per-bank config setup + a CronJob that auto-imports from a shared folder
      module: firefly-importer

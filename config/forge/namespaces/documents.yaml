apiVersion: strata.huybrechts.xyz/v1
kind: namespace
meta:
  name: documents
  annotations:
    description: Family document/reference library (k3s on Forge) — Kavita (PDF/TTRPG library) + Nextcloud (document archive/browsing layer), both reading from the haven-data Storage Box's docs sub-account (SMB, /mnt/haven-data-docs). Config-level mount paths are finalized; the Ansible/Terraform layer that provisions the actual SMB mount is not yet updated — see docs/guides/forge.md.
  labels:
    version: "1.0.0"
  tags: [haven, forge, documents, k3s, family]
spec:
  modules:
    - name: kavita
      description: PDF/EPUB/comic library server for TTRPG PDFs and reference material
      file: config/forge/modules/kavita.yaml
    - name: nextcloud-secrets
      description: Shared K8s Secret holding Nextcloud's real credentials (see module comment for why this indirection exists)
      file: config/forge/modules/nextcloud-secrets.yaml
    - name: nextcloud-postgres
      description: PostgreSQL for Nextcloud
      file: config/forge/modules/nextcloud-postgres.yaml
    - name: nextcloud-redis
      description: Redis for Nextcloud memory caching + file locking
      file: config/forge/modules/nextcloud-redis.yaml
    - name: nextcloud
      description: Family document archive/browsing layer, External Storage over the haven-data Storage Box docs sub-account (/mnt/haven-data-docs)
      file: config/forge/modules/nextcloud.yaml

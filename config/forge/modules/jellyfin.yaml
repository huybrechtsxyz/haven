apiVersion: strata.huybrechts.xyz/v1
kind: module
meta:
  name: jellyfin
  annotations:
    description: Jellyfin — media streaming server (k3s / Helm)
  labels:
    version: "1.0.0"
  tags: [haven, forge, media, jellyfin, streaming]
spec:
  type: helm
  source:
    # Official chart — still on the classic HTTP repo (not OCI-only like
    # Immich), so this one is unaffected by the strata OCI gap.
    chart_repository: https://jellyfin.github.io/jellyfin-helm
    chart_name: jellyfin
    chart_version: "3.2.0"
  kubernetes_namespace: media
  # Raw passthrough — same reasoning as the immich module: this chart's
  # top-level keys (persistence/service/ingress/jellyfin) are fixed by the
  # chart itself, so spec.configuration (no module-name prefixing) is used
  # instead of spec.services.
  configuration:
    # image.tag pinned explicitly (chart 3.2.0's default appVersion is
    # 10.11.8, which is BELOW the targetAbi (10.11.11.0) required by the
    # SSO-Auth plugin version installed by the initContainer below — Jellyfin
    # silently disables any plugin whose targetAbi exceeds the running
    # server version, which is why /sso/OID/Add/... 404'd (confirmed via
    # pod logs: "Skipping disabled plugin 5.0.0.0 of SSO Authentication").
    # Pin >= 10.11.11 to keep the plugin loadable; bump alongside future
    # plugin manifest updates.
    image:
      tag: "10.11.11"
    persistence:
      config:
        enabled: true
        storageClass: local-path
        size: 5Gi
      # Media library — read-only, backed by the haven-data Storage Box's
      # DOCS sub-account (moved 2026-08-29 from the media sub-account —
      # Jellyfin had zero live data at the time, so this was a free move),
      # SMB-mounted on the host at /mnt/haven-data-docs (same hostPath
      # approach as the immich-library module, not a separate in-pod SMB
      # mount — avoids a second independent SMB auth/mount path). Living in
      # the same tree Nextcloud already mounts lets family members upload
      # media via Nextcloud's own iOS/iPadOS app straight into this folder
      # (see nextcloud.yaml's "Media" External Storage entry). Folder named
      # generically "media/" (not "jellyfin/") since it's not tied to any
      # one app.
      media:
        enabled: true
        type: hostPath
        hostPath: /mnt/haven-data-docs/media
      cache:
        enabled: false

    service:
      type: ClusterIP
      port: 8096

    # cert-manager is proven working end-to-end (Immich's photos-tls +
    # Jellyfin's media-tls certificates both issued successfully via
    # letsencrypt-staging first, then switched to letsencrypt-prod once
    # each was verified Ready=True — same staging-first pattern as Immich,
    # see config/forge/modules/immich.yaml). Switched to prod here 2026-08-28
    # after confirming media-tls issued successfully via staging.
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: media.huybrechts.xyz
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - media.huybrechts.xyz
          secretName: media-tls

    jellyfin:
      env:
        - name: JELLYFIN_PublishedServerUrl
          value: https://media.huybrechts.xyz

    # =========================================================================
    # SSO plugin auto-install (K0lin/jellyfin-plugin-sso — see file-level
    # comment below for why this fork). Idempotent initContainer: downloads
    # the plugin's manifest, grabs the latest release zip, and unpacks it into
    # the "config" PVC's plugins/ dir — skipped entirely once already present,
    # so it's a no-op on every restart/redeploy after the first. This removes
    # the "install the plugin" manual step entirely; only the one-time
    # Authentik-provider REGISTRATION step still needs a human-created API
    # key (see file-level comment below — no way around Jellyfin's lack of a
    # headless first-run bootstrap).
    # Caveat: always installs the LATEST plugin release — if a future Jellyfin
    # server upgrade needs an older/newer plugin build for ABI compatibility,
    # this may need pinning to a specific manifest version entry instead of
    # `.[0].versions[0]`.
    # =========================================================================
    extraInitContainers:
      - name: install-sso-plugin
        image: alpine:3.20
        command: ["sh", "-c"]
        args:
          - |
            set -e
            PLUGIN_DIR=/config/plugins/SSO-Auth
            if [ -d "$PLUGIN_DIR" ]; then
              echo "SSO plugin already installed at $PLUGIN_DIR, skipping."
              exit 0
            fi
            apk add --no-cache curl unzip jq
            MANIFEST_URL="https://raw.githubusercontent.com/k0lin/jellyfin-plugin-sso/manifest-release/manifest.json"
            DOWNLOAD_URL=$(curl -fsSL "$MANIFEST_URL" | jq -r '.[0].versions[0].sourceUrl')
            mkdir -p "$PLUGIN_DIR"
            curl -fsSL "$DOWNLOAD_URL" -o /tmp/plugin.zip
            unzip -o /tmp/plugin.zip -d "$PLUGIN_DIR"
            echo "SSO plugin installed to $PLUGIN_DIR"
        volumeMounts:
          - name: config
            mountPath: /config

  # SSO setup (K0lin/jellyfin-plugin-sso — the original 9p4/jellyfin-plugin-sso
  # was archived 2026-05-12; K0lin's fork is an active, transparent
  # continuation of the same code/config/API shape, used here instead).
  #
  # Fully automated end-to-end except for ONE unavoidable one-time manual
  # step — Jellyfin has no headless bootstrap, so an admin API key can only
  # be minted via the web UI after the first-run setup wizard:
  #
  #   1. Complete Jellyfin's first-run setup wizard once (already done).
  #   2. Dashboard -> API Keys -> create a key, then:
  #      strata secret put JELLYFIN_API_KEY --value "<key>" -f config/environment.yaml
  #
  # Everything else is automated:
  #   - Plugin install: idempotent initContainer above (extraInitContainers).
  #   - Authentik-side OAuth2 provider/application + the custom "groups" scope
  #     property mapping RBAC needs (see providers.md#authentik in
  #     K0lin/jellyfin-plugin-sso): deploy/ansible-hearth/templates/authentik-blueprint.yaml.j2
  #     (mapping-group-membership, attached to provider-jellyfin's property_mappings).
  #   - Jellyfin-side OIDC provider registration: an idempotent step in
  #     .github/workflows/deploy-forge-deploy.yml (runs after every Helm
  #     deploy; POSTs to /sso/OID/Add/authentik using JELLYFIN_API_KEY +
  #     JELLYFIN_SSO_CLIENT_SECRET — safe to re-run, Add always overwrites):
  #      curl -X POST -H "Content-Type: application/json" \
  #        -d '{
  #              "oidEndpoint": "https://auth.huybrechts.xyz/application/o/jellyfin/",
  #              "oidClientId": "jellyfin",
  #              "oidSecret": "<JELLYFIN_SSO_CLIENT_SECRET>",
  #              "enabled": true,
  #              "enableAuthorization": true,
  #              "roleClaim": "groups",
  #              "oidScopes": ["groups"],
  #              "adminRoles": ["admins"],
  #              "roles": ["admins", "parents", "members"],
  #              "schemeOverride": "https"
  #            }' \
  #        "https://media.huybrechts.xyz/sso/OID/Add/authentik?api_key=<JELLYFIN_API_KEY>"
  #    schemeOverride is required: Traefik terminates TLS and forwards plain
  #    HTTP to the pod, so the plugin's own scheme detection would otherwise
  #    build an http:// redirect_uri and fail Authentik's strict redirect_uri
  #    match against the registered https:// one ("Redirect URI Error").

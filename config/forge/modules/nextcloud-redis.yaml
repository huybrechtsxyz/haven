apiVersion: strata.huybrechts.xyz/v2
kind: module
meta:
  name: nextcloud-redis
  annotations:
    description: Redis for Nextcloud memory caching + file locking — single pod
  tags: [haven, forge, documents, nextcloud, redis, cache]
spec:
  type: helm
  source:
    source_path: services/forge/nextcloud-redis
  kubernetes_namespace: documents
  configuration:
    image:
      repository: redis
      tag: 7-alpine
    # `${secret:...}` tokens are resolved at deploy time and handed to Helm
    # on stdin - never written to the build output or put on the command line.
    env:
      # Real value injected by strata at deploy time — never written here.
      NEXTCLOUD_REDIS_PASSWORD: "${secret:NEXTCLOUD_REDIS_PASSWORD}"
    service:
      port: 6379

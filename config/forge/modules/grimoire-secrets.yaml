apiVersion: strata.huybrechts.xyz/v1
kind: module
meta:
  name: grimoire-secrets
  annotations:
    description: >
      K8s Secret holding Grimoire's real OIDC client secret — referenced by
      grimoire.yaml via a plain secretKeyRef, since Grimoire's own chart is
      hand-authored and this repo's convention keeps real secret values
      inside a dedicated Secret object rather than inlined as a literal
      Deployment env value (see services/forge/grimoire-secrets/Chart.yaml).
  labels:
    version: "1.0.0"
  tags: [haven, forge, documents, grimoire, secrets]
spec:
  type: helm
  source:
    repository: haven
    source_path: services/forge/grimoire-secrets
  kubernetes_namespace: documents
  references:
    secrets:
      - GRIMOIRE_SSO_CLIENT_SECRET
  configuration:
    # Credentials MUST live under a literal `env:` dict — strata's Helm
    # secret substitution only resolves `${TOKEN}` placeholders found inside
    # a dict node keyed literally "env" (any nesting depth).
    env:
      # Real value injected by strata at deploy time — never written here.
      GRIMOIRE_SSO_CLIENT_SECRET: "${GRIMOIRE_SSO_CLIENT_SECRET}"

apiVersion: strata.huybrechts.xyz/v2
kind: module
meta:
  name: nextcloud-postgres
  annotations:
    description: PostgreSQL for Nextcloud — single pod, no operator
  tags: [haven, forge, documents, nextcloud, postgres, database]
spec:
  type: helm
  source:
    source_path: services/forge/nextcloud-postgres
  kubernetes_namespace: documents
  configuration:
    image:
      repository: postgres
      tag: 16-alpine
    env:
      POSTGRES_USER: nextcloud
      POSTGRES_DB: nextcloud
      # Real value injected by strata at deploy time — never written here.
      POSTGRES_PASSWORD: "${secret:NEXTCLOUD_DB_PASSWORD}"
    persistence:
      storageClass: local-path
      size: 10Gi
    service:
      port: 5432

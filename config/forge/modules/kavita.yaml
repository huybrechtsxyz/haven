apiVersion: strata.huybrechts.xyz/v1
kind: module
meta:
  name: kavita
  annotations:
    description: Kavita — PDF/EPUB/comic library server for TTRPG PDFs and family reference material
  labels:
    version: "1.0.0"
  tags: [haven, forge, documents, kavita, library]
spec:
  type: helm
  source:
    repository: haven
    source_path: services/forge/kavita
  kubernetes_namespace: documents
  configuration:
    image:
      repository: lscr.io/linuxserver/kavita
      tag: latest
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Brussels
    persistence:
      config:
        storageClass: local-path
        size: 5Gi
    # Same haven-data Storage Box docs sub-account tree as Nextcloud, SMB-
    # mounted on the host at /mnt/haven-data-docs — Kavita only reads, never
    # renames/reorganizes, so sharing the same tree as Nextcloud is safe.
    library:
      hostPath: /mnt/haven-data-docs/books
    service:
      port: 5000
    # Staging-first cert-manager pattern, same as Immich/Jellyfin/Nextcloud —
    # books.huybrechts.xyz has never had a cert issued before, so it needs its
    # own HTTP-01 challenge to succeed at least once via letsencrypt-staging
    # before switching to letsencrypt-prod (rate-limited to 5 certs/domain/week).
    # Once `kubectl describe certificate books-tls -n documents` shows
    # Ready: True, switch cluster-issuer below to letsencrypt-prod.
    #
    # NOTE: confirmed live (2026-08-29) that Kavita's own ASP.NET Core OIDC
    # handler sends redirect_uri=https://books.huybrechts.xyz/signin-oidc
    # even though Traefik terminates TLS and forwards plain HTTP to the pod
    # — the opposite of what was originally assumed here (that it would
    # need a Jellyfin-style schemeOverride to avoid staying on http://).
    # The Authentik blueprint's Kavita redirect_uri is https:// to match.
    # See docs/services/kavita.md's SSO section for the full writeup.
    ingress:
      enabled: true
      className: traefik
      host: books.huybrechts.xyz
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
      tls:
        - hosts:
            - books.huybrechts.xyz
          secretName: books-tls

  # SSO: Kavita's native OIDC settings are patched into appsettings.json by
  # deploy-forge-deploy.yml after every Helm deploy (not part of this Helm
  # values block) — see docs/services/kavita.md's SSO section.

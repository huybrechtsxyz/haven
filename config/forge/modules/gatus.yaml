apiVersion: strata.huybrechts.xyz/v2
kind: module
meta:
  name: gatus
  annotations:
    description: Gatus — health/status dashboard for every family service (Immich, Jellyfin, Nextcloud, Kavita, Grimoire, FoundryVTT, Firefly III, Authentik, Vaultwarden, WUD, Portainer, pgAdmin, Yuvomi). Members-only, no public access — real OIDC login via Authentik.
  tags: [haven, forge, system, monitoring, gatus]
spec:
  type: helm
  source:
    # Official chart (twin/helm-charts, classic HTTP repo).
    chart_repository: https://twin.github.io/helm-charts
    chart_name: gatus
    chart_version: "1.0.0"
  kubernetes_namespace: system
  configuration:
    # Gatus's chart ships a flat top-level `env: {}` field: strata resolves the
    # `${secret:...}` tokens into real pod env vars at deploy time.
    env:
      GATUS_OIDC_CLIENT_SECRET: "${secret:GATUS_SSO_CLIENT_SECRET}"
      GATUS_SMTP_HOST: "${secret:INFOMANIAK_EMAIL__HOST}"
      GATUS_SMTP_PORT: "${secret:INFOMANIAK_EMAIL__PORT}"
      GATUS_SMTP_USERNAME: "${secret:INFOMANIAK_EMAIL__USERNAME}"
      GATUS_SMTP_PASSWORD: "${secret:INFOMANIAK_EMAIL__PASSWORD}"

    # Small persistent volume so uptime/history survives pod restarts —
    # otherwise Gatus defaults to in-memory storage (lost on every restart).
    persistence:
      enabled: true
      size: 200Mi
      storageClassName: local-path

    # Staging-first cert-manager pattern, same as every other Forge app —
    # status.huybrechts.xyz's HTTP-01 challenge succeeded via
    # letsencrypt-staging (confirmed 2026-08-31) — switched to
    # letsencrypt-prod for a real trusted cert, now that the flow is proven.
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - status.huybrechts.xyz
      tls:
        - secretName: status-tls
          hosts:
            - status.huybrechts.xyz

    # Gatus's own config.yaml content — passed through verbatim by the chart.
    config:
      storage:
        type: sqlite
        path: /data/data.db

      ui:
        title: Haven Status
        header: Haven
        dashboard-heading: Haven Health Dashboard
        dashboard-subheading: Live status of every family service
        default-sort-by: group

      # Members-only OIDC login — Gatus has native OIDC support
      # (unlike a forward-auth proxy setup). Authentik's own
      # policy-group-members binding on the Gatus Application (see
      # authentik-blueprint.yaml.j2) enforces real access control at the
      # authorization step, not just dashboard visibility — same
      # enforcement mechanism already confirmed working for every other
      # app in this repo.
      security:
        oidc:
          issuer-url: https://auth.huybrechts.xyz/application/o/gatus/
          redirect-url: https://status.huybrechts.xyz/authorization-code/callback
          client-id: gatus
          # Gatus's OWN runtime env-var substitution (documented:
          # "you can use environment variables directly in the
          # configuration file") reads this from the pod's actual
          # environment — populated by the `env:` block above. Two separate
          # substitution passes: strata resolves `${secret:GATUS_SSO_CLIENT_SECRET}`
          # into a real pod env var at deploy time; Gatus resolves
          # ${GATUS_OIDC_CLIENT_SECRET} from that same env var at its own
          # process startup. `$${...}` is strata's escape for a literal `${...}`.
          client-secret: "$${GATUS_OIDC_CLIENT_SECRET}"
          scopes: ["openid", "email", "profile"]

      # Email alerting — reuses the same shared Infomaniak mailbox as
      # Vaultwarden/Authentik (see vaultwarden.yaml). Same double-substitution
      # pattern as the OIDC client-secret above: strata resolves
      # `${secret:INFOMANIAK_EMAIL__*}` into real pod env vars at deploy time;
      # Gatus's own runtime env-var substitution then reads ${GATUS_SMTP_*}.
      alerting:
        email:
          from: gatus@huybrechts.xyz
          host: "$${GATUS_SMTP_HOST}"
          port: $${GATUS_SMTP_PORT}
          username: "$${GATUS_SMTP_USERNAME}"
          password: "$${GATUS_SMTP_PASSWORD}"
          to: "admin@huybrechts.xyz"
          default-alert:
            enabled: true
            failure-threshold: 3
            success-threshold: 2
            send-on-resolved: true
            description: "healthcheck failed"

      # Basic reachability checks for every currently-deployed family app.
      # Grouped by node (hearth/forge) for the dashboard's group view.
      endpoints:
        - name: Authentik
          group: hearth
          url: "https://auth.huybrechts.xyz"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: email
        - name: Vaultwarden
          group: hearth
          url: "https://vault.huybrechts.xyz"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: email
        - name: WUD
          group: hearth
          url: "https://wud.huybrechts.xyz"
          interval: 5m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: email
        - name: Portainer
          group: hearth
          url: "https://portainer.huybrechts.xyz"
          interval: 5m
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: email
        - name: Immich
          group: forge
          url: "https://photos.huybrechts.xyz"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: email
        - name: Jellyfin
          group: forge
          url: "https://media.huybrechts.xyz"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: email
        - name: Nextcloud
          group: forge
          url: "https://docs.huybrechts.xyz"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: email
        - name: Kavita
          group: forge
          url: "https://books.huybrechts.xyz"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: email
        - name: Grimoire
          group: forge
          url: "https://grimoire.huybrechts.xyz"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: email
        - name: FoundryVTT
          group: forge
          url: "https://foundry.huybrechts.xyz"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: email
        - name: pgAdmin
          group: forge
          url: "https://pgadmin.huybrechts.xyz"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: email
        - name: Yuvomi
          group: forge
          url: "https://family.huybrechts.xyz"
          interval: 60s
          conditions:
            - "[STATUS] == 200"
          alerts:
            - type: email

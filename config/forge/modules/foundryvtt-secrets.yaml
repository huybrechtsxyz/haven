apiVersion: strata.huybrechts.xyz/v1
kind: module
meta:
  name: foundryvtt-secrets
  annotations:
    description: >
      K8s Secret holding FoundryVTT's real foundryvtt.com account
      credentials and admin key — referenced by foundryvtt.yaml via a plain
      secretKeyRef, since FoundryVTT's own chart is hand-authored and this
      repo's convention keeps real secret values inside a dedicated Secret
      object rather than inlined as a literal Deployment env value (see
      services/forge/foundryvtt-secrets/Chart.yaml).
  labels:
    version: "1.0.0"
  tags: [haven, forge, gaming, foundryvtt, secrets]
spec:
  type: helm
  source:
    repository: haven
    source_path: services/forge/foundryvtt-secrets
  kubernetes_namespace: gaming
  references:
    secrets:
      - FOUNDRY_USERNAME
      - FOUNDRY_PASSWORD
      - FOUNDRY_ADMIN_KEY
  configuration:
    # Credentials MUST live under a literal `env:` dict — strata's Helm
    # secret substitution only resolves `${TOKEN}` placeholders found inside
    # a dict node keyed literally "env" (any nesting depth).
    env:
      # Real values injected by strata at deploy time — never written here.
      # These are manually provided in Infisical (your real foundryvtt.com
      # account credentials), not strata-generated like most other secrets
      # in this repo.
      FOUNDRY_USERNAME: "${FOUNDRY_USERNAME}"
      FOUNDRY_PASSWORD: "${FOUNDRY_PASSWORD}"
      FOUNDRY_ADMIN_KEY: "${FOUNDRY_ADMIN_KEY}"

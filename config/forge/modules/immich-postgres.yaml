apiVersion: strata.huybrechts.xyz/v1
kind: module
meta:
  name: immich-postgres
  annotations:
    description: PostgreSQL (vectorchord-enabled) for Immich — single pod, no operator
  labels:
    version: "1.0.0"
  tags: [haven, forge, immich, postgres, database]
spec:
  type: helm
  source:
    repository: haven
    source_path: services/forge/immich-postgres
  kubernetes_namespace: immich
  references:
    secrets:
      - IMMICH_DB_PASSWORD
  configuration:
    image:
      repository: ghcr.io/immich-app/postgres
      tag: 14-vectorchord0.4.3-pgvectors0.2.0
    env:
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      # Real value injected by strata at deploy time — never written here.
      POSTGRES_PASSWORD: "${IMMICH_DB_PASSWORD}"
    persistence:
      storageClass: local-path
      size: 10Gi
    service:
      port: 5432

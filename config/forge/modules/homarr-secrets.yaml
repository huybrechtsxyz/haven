apiVersion: strata.huybrechts.xyz/v1
kind: module
meta:
  name: homarr-secrets
  annotations:
    description: >
      Two K8s Secrets holding Homarr's real credentials (OIDC client secret,
      database encryption key) — referenced by homarr.yaml via
      envSecrets.*.existingSecret, since the official Homarr chart's own
      OIDC/DB credential fields aren't reachable by strata's Helm secret
      substitution (see homarr-secrets local chart's Chart.yaml comment for
      the full writeup).
  labels:
    version: "1.0.0"
  tags: [haven, forge, system, homarr, secrets]
spec:
  type: helm
  source:
    repository: haven
    source_path: services/forge/homarr-secrets
  kubernetes_namespace: system
  references:
    secrets:
      - HOMARR_SSO_CLIENT_SECRET
      - HOMARR_DB_ENCRYPTION_KEY
  configuration:
    # Credentials MUST live under a literal `env:` dict — strata's Helm
    # secret substitution only resolves `${TOKEN}` placeholders found inside
    # a dict node keyed literally "env" (any nesting depth).
    env:
      # Real values injected by strata at deploy time — never written here.
      HOMARR_SSO_CLIENT_SECRET: "${HOMARR_SSO_CLIENT_SECRET}"
      HOMARR_DB_ENCRYPTION_KEY: "${HOMARR_DB_ENCRYPTION_KEY}"

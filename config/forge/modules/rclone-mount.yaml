apiVersion: strata.huybrechts.xyz/v1
kind: module
meta:
  name: rclone-mount
  annotations:
    description: Mounts the haven-docs S3 bucket onto the Forge host filesystem via rclone/FUSE, shared by Nextcloud + Kavita
  labels:
    version: "1.0.0"
  tags: [haven, forge, system, rclone, storage]
spec:
  type: helm
  source:
    repository: haven
    source_path: services/forge/rclone-mount
  kubernetes_namespace: system
  references:
    secrets:
      - HETZNER_S3_ACCESS_KEY
      - HETZNER_S3_SECRET_KEY
  configuration:
    image:
      repository: rclone/rclone
      tag: latest
    s3:
      bucket: haven-docs
      endpoint: https://eu-central.your-objectstorage.com
      region: eu-central
    # Credentials MUST live under a literal `env:` dict, not nested under
    # `s3:` above — strata's Helm secret substitution only resolves `${TOKEN}`
    # placeholders found inside a dict node keyed literally "env" (any
    # nesting depth). Confirmed (2026-08-28, real CI run): with these under
    # `s3:`, the deployed pod had the literal unsubstituted string
    # "${HETZNER_S3_ACCESS_KEY}" as its env var value instead of the real
    # secret.
    env:
      # Real values injected by strata at deploy time — never written here.
      HETZNER_S3_ACCESS_KEY: "${HETZNER_S3_ACCESS_KEY}"
      HETZNER_S3_SECRET_KEY: "${HETZNER_S3_SECRET_KEY}"
    mount:
      hostPath: /mnt/haven-docs
      vfsCacheMode: writes
      dirCacheTime: 30s
      # Pre-created via rclone mkdir (direct S3 API call, not a FUSE mkdir)
      # by this chart's initContainer — see services/forge/rclone-mount's
      # values.yaml/deployment.yaml for the full explanation. Add new
      # entries here as future apps need their own subfolder.
      subfolders:
        - books

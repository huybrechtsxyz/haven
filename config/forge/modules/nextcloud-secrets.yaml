apiVersion: strata.huybrechts.xyz/v1
kind: module
meta:
  name: nextcloud-secrets
  annotations:
    description: >
      Single K8s Secret holding Nextcloud's real credentials — referenced by
      nextcloud.yaml/nextcloud-redis.yaml via existingSecret/secretKeyRef,
      since the official nextcloud chart's own password fields aren't
      reachable by strata's Helm secret substitution (see nextcloud.yaml's
      module comment for the full writeup).
  labels:
    version: "1.0.0"
  tags: [haven, forge, documents, nextcloud, secrets]
spec:
  type: helm
  source:
    repository: haven
    source_path: services/forge/nextcloud-secrets
  kubernetes_namespace: documents
  references:
    secrets:
      - NEXTCLOUD_ADMIN_PASSWORD
      - NEXTCLOUD_DB_PASSWORD
      - NEXTCLOUD_REDIS_PASSWORD
      - NEXTCLOUD_SSO_CLIENT_SECRET
  configuration:
    # Credentials MUST live under a literal `env:` dict — strata's Helm
    # secret substitution only resolves `${TOKEN}` placeholders found inside
    # a dict node keyed literally "env" (any nesting depth).
    env:
      # Real values injected by strata at deploy time — never written here.
      NEXTCLOUD_ADMIN_PASSWORD: "${NEXTCLOUD_ADMIN_PASSWORD}"
      NEXTCLOUD_DB_PASSWORD: "${NEXTCLOUD_DB_PASSWORD}"
      NEXTCLOUD_REDIS_PASSWORD: "${NEXTCLOUD_REDIS_PASSWORD}"
      NEXTCLOUD_SSO_CLIENT_SECRET: "${NEXTCLOUD_SSO_CLIENT_SECRET}"

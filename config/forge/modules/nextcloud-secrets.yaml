apiVersion: strata.huybrechts.xyz/v2
kind: module
meta:
  name: nextcloud-secrets
  annotations:
    description: >
      Single K8s Secret holding Nextcloud's real credentials — referenced by
      nextcloud.yaml/nextcloud-redis.yaml via existingSecret/secretKeyRef,
      since the official nextcloud chart's own password fields aren't
      reachable by strata's Helm secret substitution (see nextcloud.yaml's
      module comment for the full writeup).
  tags: [haven, forge, documents, nextcloud, secrets]
spec:
  type: helm
  source:
    source_path: services/forge/nextcloud-secrets
  kubernetes_namespace: documents
  configuration:
    # `${secret:...}` tokens are resolved at deploy time and handed to Helm
    # on stdin - never written to the build output or put on the command line.
    env:
      # Real values injected by strata at deploy time — never written here.
      NEXTCLOUD_ADMIN_PASSWORD: "${secret:NEXTCLOUD_ADMIN_PASSWORD}"
      NEXTCLOUD_DB_PASSWORD: "${secret:NEXTCLOUD_DB_PASSWORD}"
      NEXTCLOUD_REDIS_PASSWORD: "${secret:NEXTCLOUD_REDIS_PASSWORD}"
      NEXTCLOUD_SSO_CLIENT_SECRET: "${secret:NEXTCLOUD_SSO_CLIENT_SECRET}"
      INFOMANIAK_EMAIL__HOST: "${secret:INFOMANIAK_EMAIL__HOST}"
      INFOMANIAK_EMAIL__PORT: "${secret:INFOMANIAK_EMAIL__PORT}"
      INFOMANIAK_EMAIL__USERNAME: "${secret:INFOMANIAK_EMAIL__USERNAME}"
      INFOMANIAK_EMAIL__PASSWORD: "${secret:INFOMANIAK_EMAIL__PASSWORD}"

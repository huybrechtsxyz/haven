apiVersion: strata.huybrechts.xyz/v2
kind: firewall
meta:
  name: forge-firewall
  annotations:
    description: Firewall for Forge VPS - k3s API + web ingress from private network; SSH from private network only
  tags: [haven, firewall, forge, family]
spec:
  # Rendered as a Hetzner Cloud Firewall (network rules only). No loopback
  # rules: a cloud firewall never sees `lo` traffic, so they are not modelled.
  reset: true
  defaults:
    - direction: in
      permission: deny
      comment: Deny all incoming traffic by default
    - direction: out
      permission: deny
      comment: Deny all outgoing traffic by default
  allow:
    # Essential system services
    - direction: out
      proto: udp
      port: [53]
      comment: DNS (UDP)
    - direction: out
      proto: tcp
      port: [53]
      comment: DNS (TCP)
    - direction: out
      proto: udp
      port: [123]
      comment: NTP
    # Package management + image pulls + Helm charts
    - direction: out
      proto: tcp
      port: [20, 21]
      comment: FTP (apt)
    - direction: out
      proto: tcp
      port: [11371]
      comment: GPG keyserver
    - direction: out
      proto: tcp
      port: [80]
      comment: HTTP outbound (apt, image pulls, Helm)
    - direction: out
      proto: tcp
      port: [443]
      comment: HTTPS outbound (apt, image pulls, Helm, OCSP)
    # BorgBackup - Hetzner Storage Box uses SSH on port 23
    - direction: out
      proto: tcp
      port: [23]
      comment: SSH to Storage Box (BorgBackup)
    # Media library mount - Storage Box subaccounts don't support NFS,
    # only SMB/CIFS + SSH.
    - direction: out
      proto: tcp
      port: [445]
      comment: SMB to Storage Box (media library mount)
    # Portainer Kubernetes Edge Agent - the regular heartbeat/poll goes over
    # HTTPS (443, already allowed above), but Portainer's "live connect"
    # tunnel (console access, live logs/stats) uses a SEPARATE port - 8000
    # by default, confirmed by decoding this environment's own edge key
    # (format: <portainer_url>|<tunnel_host>:8000|<key>|<version>). Routed
    # over the private network via forge-config.yml's /etc/hosts override
    # (portainer.huybrechts.xyz -> Hearth's private IP), same pattern as
    # Authentik's LAN routing - scoped to the private network, not public.
    - direction: out
      proto: tcp
      port: [8000]
      to: 10.0.0.0/8
      comment: Portainer Edge Agent live-connect tunnel (private network only)
    # Public web ingress
    - direction: in
      proto: tcp
      port: [80]
      comment: HTTP (redirect to HTTPS)
    - direction: in
      proto: tcp
      port: [443]
      comment: HTTPS
    # Private network - SSH, k3s API, Flannel VXLAN
    - direction: in
      proto: tcp
      port: [22]
      from: 10.0.0.0/8
      comment: SSH (private network only)
    - direction: in
      proto: tcp
      port: [6443]
      from: 10.0.0.0/8
      comment: k3s API server (private network only)
    - direction: in
      proto: udp
      port: [8472]
      from: 10.0.0.0/8
      comment: Flannel VXLAN (private network only)

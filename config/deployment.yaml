apiVersion: strata.huybrechts.xyz/v1
kind: deployment
meta:
  name: haven_deploy_prd
  annotations:
    description: Production deployment for the family platform on Hetzner — Hearth (Docker Compose) + Forge (k3s)
  labels:
    version: "1.0.0"
  tags: [haven, hetzner, family, production, deployment]
spec:
  configurations:
    - name: config
      file: config/configuration.yaml

  lifecycle: null

  layers:
    environment: prd

  properties:
    environment: prd

  workspace:
    name: haven_platform
    description: Haven Family Platform Workspace
    file: "config/stack/workspace.yaml"

  environments:
    - "config/environment.yaml"

  stages:
    # Stage 1 — provision Hearth VPS via Terraform
    - name: infrastructure_hearth
      topology: hetzner_hearth
      scope: all
      # deploy/terraform/main.tf declares both the hearth + forge modules unconditionally in one
      # shared root config, so every plan/apply needs all 5 of these regardless of which stage runs.
      # Nothing else (Vaultwarden/Authentik/WUD/Portainer/S3/etc.) is read by this Terraform root.
      secrets:
        - HETZNER_API_TOKEN
        - HETZNER_PUBLIC_KEY
        - HETZNER_PRIVATE_KEY
        - HEARTH_SSH_PRIVATE_KEY
        - HETZNER_ROOT_PASSWORD
      depends_on: null
      on_failure: stop

    # Stage 2 — provision Forge VPS via Terraform (after Hearth — shared network must exist first)
    - name: infrastructure_forge
      topology: hetzner_forge
      scope: all
      secrets:
        - HETZNER_API_TOKEN
        - HETZNER_PUBLIC_KEY
        - HETZNER_PRIVATE_KEY
        - HEARTH_SSH_PRIVATE_KEY
        - HETZNER_ROOT_PASSWORD
      depends_on: infrastructure_hearth
      on_failure: stop

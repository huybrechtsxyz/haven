apiVersion: strata.huybrechts.xyz/v2
kind: deployment
meta:
  # Kept as `haven_deploy_prd`: the build output lands in build/haven_deploy_prd/,
  # which the Hearth Ansible playbook reads, and it matches the Terraform Cloud
  # workspace of the same name.
  name: haven_deploy_prd
  annotations:
    description: Production deployment for the family platform on Hetzner - Hearth (Docker Compose) + Forge (k3s)
  tags: [haven, hetzner, family, production, deployment]
spec:
  workspace: haven_platform
  environments:
    - prd
  # Image and chart pins (config/versions.yaml). A pin wins over the module.
  version: prd

  # Forge: the context in the k3s kubeconfig the workflows fetch from the node
  # (/etc/rancher/k3s/k3s.yaml names it `default`). Helm refuses to run if the
  # caller's kubeconfig has no such context, instead of using whatever is active.
  kube_context: default

  # Hearth is never deployed by strata (its compose deployer targets Docker
  # Swarm; Hearth runs plain `docker compose`, driven by Ansible). This context
  # deliberately does not exist: a `deploy run` that selects the
  # applications_hearth step stops before anything changes, instead of running
  # `docker stack deploy` against whatever Docker the caller has. Steps that do
  # not use Compose are unaffected.
  docker_context: hearth-not-deployed-by-strata
  properties:
    environment: prd

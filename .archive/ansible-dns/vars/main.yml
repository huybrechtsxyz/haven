# =============================================================================
# Non-sensitive configuration for haven-dns.yml
# INWX credentials are passed via --extra-vars at run time and never
# committed to the repository (see the playbook header for the required keys).
# =============================================================================

# Deployment name — used to locate build artifacts
deployment_name: haven_deploy_prd-1.0.0

# Path to the DNS vars file generated by `strata build run`
# (build/<deployment_name>/ansible/dns.yml — provides `strata_dns_zones`).
# Override with -e dns_vars_file=... to point at a different build artifact.
dns_vars_file: "{{ playbook_dir }}/../../build/{{ deployment_name }}/ansible/dns.yml"

# INWX API environment — 'ote' is the free sandbox for testing, 'live' is production.
inwx_api_env: live

# =============================================================================
# S3 bucket definitions for Forge workloads.
# Credentials are injected at run time via environment variables:
#   AWS_ACCESS_KEY_ID      — Hetzner Object Storage access key
#   AWS_SECRET_ACCESS_KEY  — Hetzner Object Storage secret key
# =============================================================================

# Hetzner Object Storage — eu-central region
# API: https://docs.hetzner.com/storage/object-storage/
s3_endpoint_url: "https://eu-central.your-objectstorage.com"
s3_region: "eu-central"

s3_buckets:
  - name: haven-photos
    description: "Immich external photo library (originals + derivatives)"
  - name: haven-media
    description: "Media overflow — large binary assets if Storage Box capacity is exhausted"
  - name: haven-docs
    description: "Family documents — books/PDFs/EPUBs, manuals, general archive, anything organized/browsed via Nextcloud, Kavita, Paperless-ngx"

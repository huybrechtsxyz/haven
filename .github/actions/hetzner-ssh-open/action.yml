name: "Hetzner - Open temporary SSH access"
description: >
  Looks up a Hetzner server's public IP and its firewall's ID, then opens a
  temporary SSH (port 22) rule scoped to the runner's own public IP. Skips
  the actual firewall mutation on dry_run (lookups still run so IDs are
  available for logging/debugging). Pair with hetzner-ssh-close to remove
  the rule again at the end of the job.

inputs:
  hetzner_api_token:
    description: "Hetzner Cloud API token"
    required: true
  server_name:
    description: "Hetzner Cloud server name, e.g. haven-platform-hearth"
    required: true
  firewall_name:
    description: "Hetzner Cloud firewall name, e.g. haven-platform-fw-hearth"
    required: true
  dry_run:
    description: "Skip the actual firewall rule mutation"
    required: false
    default: "false"

outputs:
  server_ip:
    description: "Public IPv4 address of the server"
    value: ${{ steps.server_ip.outputs.ip }}
  firewall_id:
    description: "Hetzner Cloud firewall ID (needed by hetzner-ssh-close)"
    value: ${{ steps.fw.outputs.id }}

runs:
  using: composite
  steps:
    - name: Get runner public IP
      id: runner_ip
      shell: bash
      run: echo "ip=$(curl -sf https://api.ipify.org)" >> "$GITHUB_OUTPUT"

    - name: Get server public IP
      id: server_ip
      shell: bash
      env:
        HETZNER_API_TOKEN: ${{ inputs.hetzner_api_token }}
      run: |
        ip=$(curl -sf \
          -H "Authorization: Bearer $HETZNER_API_TOKEN" \
          "https://api.hetzner.cloud/v1/servers?name=${{ inputs.server_name }}" \
          | jq -r '.servers[0].public_net.ipv4.ip')
        if [ -z "$ip" ] || [ "$ip" = "null" ]; then
          echo "::error::Server '${{ inputs.server_name }}' not found. Run deploy-infra.yml first."
          exit 1
        fi
        echo "ip=$ip" >> "$GITHUB_OUTPUT"

    - name: Get firewall ID
      id: fw
      shell: bash
      env:
        HETZNER_API_TOKEN: ${{ inputs.hetzner_api_token }}
      run: |
        RESPONSE=$(curl -sf \
          -H "Authorization: Bearer $HETZNER_API_TOKEN" \
          "https://api.hetzner.cloud/v1/firewalls?name=${{ inputs.firewall_name }}")
        id=$(echo "$RESPONSE" | jq -r '.firewalls[0].id // empty')
        if [ -z "$id" ]; then
          echo "::error::Firewall '${{ inputs.firewall_name }}' not found."
          curl -sf -H "Authorization: Bearer $HETZNER_API_TOKEN" \
            "https://api.hetzner.cloud/v1/firewalls" | jq -r '.firewalls[].name'
          exit 1
        fi
        echo "id=$id" >> "$GITHUB_OUTPUT"

    - name: Open temporary SSH rule for runner
      if: ${{ inputs.dry_run != 'true' }}
      shell: bash
      env:
        HETZNER_API_TOKEN: ${{ inputs.hetzner_api_token }}
      run: |
        FW_ID="${{ steps.fw.outputs.id }}"
        RUNNER_IP="${{ steps.runner_ip.outputs.ip }}/32"
        RUN_ID="${{ github.run_id }}"
        CURRENT=$(curl -sf \
          -H "Authorization: Bearer $HETZNER_API_TOKEN" \
          "https://api.hetzner.cloud/v1/firewalls/$FW_ID")
        PAYLOAD=$(echo "$CURRENT" | jq \
          --arg ip "$RUNNER_IP" \
          --arg run "$RUN_ID" \
          '{rules: (.firewall.rules + [{direction:"in",protocol:"tcp",port:"22",source_ips:[$ip],description:("CI ssh run-"+$run)}])}')
        HTTP=$(curl -s -o /tmp/fw_set.json -w "%{http_code}" -X POST \
          -H "Authorization: Bearer $HETZNER_API_TOKEN" \
          -H "Content-Type: application/json" \
          "https://api.hetzner.cloud/v1/firewalls/$FW_ID/actions/set_rules" \
          -d "$PAYLOAD")
        cat /tmp/fw_set.json
        [ "$HTTP" -lt 400 ]

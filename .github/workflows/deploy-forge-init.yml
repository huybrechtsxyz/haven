# ==============================================================================
# Workflow: Forge — Init (one-time server bootstrap)
# ==============================================================================
# One-time initialisation of a fresh Forge VPS: installs k3s (single-node,
# Traefik enabled — Forge terminates its own TLS via cert-manager, independent
# of Hearth's Caddy, so Forge apps can be added/changed freely without ever
# touching Hearth), creates the haven service user, optionally mounts the
# Storage Box SMB share (media library — subaccounts don't support NFS),
# hardens SSH, and generates the BorgBackup SSH key pair. Idempotent (safe to
# re-run) but normally only needed once per server — routine changes will go
# through forge-config.yml / forge-deploy.yml once those exist (see
# deploy-forge.yml).
#
# Prerequisites: deploy-infra.yml must have run at least once (VPS exists).
# ==============================================================================

name: 31 - Forge - Init

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Confirm branch to deploy (must match the branch this workflow runs on)"
        type: string
        required: true
      dry_run:
        description: "Dry run (skip playbook execution)"
        type: boolean
        default: false
      configure_borg:
        description: "Initialise BorgBackup repo on Storage Box (run only after SSH key is authorised in Hetzner Robot)"
        type: boolean
        default: false
      configure_smb:
        description: "Mount Storage Box SMB share at /mnt/storagebox (media library) — Hetzner Storage Box subaccounts don't support NFS"
        type: boolean
        default: false

permissions:
  contents: read

env:
  STRATA_OUTPUT: json
  DEPLOYMENT_FILE: "config/deployment.yaml"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  forge-init:
    name: Init Forge
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------------
      # Safety: block main branch deployments
      # ------------------------------------------------------------------
      - name: Block deployment from main branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "::error::Deployment from 'main' is blocked. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" = "main" ]; then
            echo "::error::Branch input cannot be 'main'. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" != "${{ github.ref_name }}" ]; then
            echo "::error::Branch input '${{ inputs.branch }}' does not match the running branch '${{ github.ref_name }}'. Re-run from the correct branch."
            exit 1
          fi

      # ------------------------------------------------------------------
      # Network setup — get IP, open SSH on Forge firewall
      # ------------------------------------------------------------------
      - name: Open temporary SSH access
        id: ssh
        uses: ./.github/actions/hetzner-ssh-open
        with:
          hetzner_api_token: ${{ secrets.HETZNER_API_TOKEN }}
          server_name: haven-platform-forge
          firewall_name: haven-platform-fw-forge
          dry_run: ${{ inputs.dry_run }}

      # ------------------------------------------------------------------
      # Ansible setup
      # ------------------------------------------------------------------
      - name: Setup strata
        if: ${{ inputs.dry_run != true }}
        uses: huybrechtsxyz/strata/.github/actions/setup-strata@v1.8.3
        with:
          # See deploy-infra.yml for why this is '==1.8.3' — also fixes 'strata
          # deploy run' crashing unconditionally on every invocation (v1.7.0-1.8.2).
          strata-version: "==1.8.3"
        env:
          # See deploy-infra.yml for why this is set — no-op on GitHub-hosted runners.
          UV_INDEX_STRATEGY: unsafe-best-match

      - name: Install Ansible
        if: ${{ inputs.dry_run != true }}
        run: pip install ansible-core

      - name: Write deploy SSH private key
        if: ${{ inputs.dry_run != true }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_PRIVATE_KEY }}" > ~/.ssh/haven_ed25519
          chmod 600 ~/.ssh/haven_ed25519

      - name: Install Ansible collections
        if: ${{ inputs.dry_run != true }}
        working-directory: deploy/ansible-forge
        run: ansible-galaxy collection install -r requirements.yml -p ./collections

      # ------------------------------------------------------------------
      # Init (one-time server initialisation)
      # ------------------------------------------------------------------
      - name: Write Ansible vars file for forge init
        if: ${{ (inputs.configure_borg == true || inputs.configure_smb == true) && inputs.dry_run != true }}
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          : > /tmp/init_vars.yml

          # storagebox_host/subaccount/password are needed for BOTH BorgBackup
          # (SSH) and the SMB media-library mount — fetched once regardless of
          # which flag(s) triggered this step.
          set +e
          VALUES=$(strata values get STORAGEBOX_FORGE_PASSWORD -f $DEPLOYMENT_FILE --output json)
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "::error::strata values get failed (exit $STATUS). Non-sensitive error detail:"
            echo "$VALUES" | jq -r '.errors[]?' 2>/dev/null || echo "(no parseable error detail)"
            exit $STATUS
          fi
          STORAGEBOX_PASSWORD=$(echo "$VALUES" | jq -r '.data.results.STORAGEBOX_FORGE_PASSWORD')
          cat >> /tmp/init_vars.yml << VARSEOF
          storagebox_host: "${{ vars.STORAGEBOX_HOST }}"
          storagebox_subaccount: "${{ vars.STORAGEBOX_SUBACCOUNT_FORGE }}"
          storagebox_password: "$STORAGEBOX_PASSWORD"
          VARSEOF

          if [ "${{ inputs.configure_borg }}" = "true" ]; then
            set +e
            BORG_VALUES=$(strata values get BORG_PASSPHRASE_FORGE -f $DEPLOYMENT_FILE --output json)
            STATUS=$?
            set -e
            if [ $STATUS -ne 0 ]; then
              echo "::error::strata values get failed (exit $STATUS). Non-sensitive error detail:"
              echo "$BORG_VALUES" | jq -r '.errors[]?' 2>/dev/null || echo "(no parseable error detail)"
              exit $STATUS
            fi
            BORG_PASSPHRASE=$(echo "$BORG_VALUES" | jq -r '.data.results.BORG_PASSPHRASE_FORGE')
            cat >> /tmp/init_vars.yml << VARSEOF
          configure_borg: true
          borg_passphrase: "$BORG_PASSPHRASE"
          VARSEOF
          fi

      - name: Run forge-init playbook
        if: ${{ inputs.dry_run != true }}
        working-directory: deploy/ansible-forge
        run: |
          if [ "${{ inputs.configure_borg }}" = "true" ] || [ "${{ inputs.configure_smb }}" = "true" ]; then
            EXTRA_ARGS="-e @/tmp/init_vars.yml"
          else
            EXTRA_ARGS="-e configure_borg=false"
          fi
          ansible-playbook forge-init.yml \
            -i "${{ steps.ssh.outputs.server_ip }}," \
            --private-key ~/.ssh/haven_ed25519 \
            $EXTRA_ARGS

      - name: Clean up init vars file
        if: ${{ always() && inputs.dry_run != true }}
        run: rm -f /tmp/init_vars.yml

      # ------------------------------------------------------------------
      # Cleanup — always remove temporary SSH rule
      # ------------------------------------------------------------------
      - name: Close temporary SSH access
        if: ${{ always() }}
        uses: ./.github/actions/hetzner-ssh-close
        with:
          hetzner_api_token: ${{ secrets.HETZNER_API_TOKEN }}
          firewall_id: ${{ steps.ssh.outputs.firewall_id }}
          dry_run: ${{ inputs.dry_run }}

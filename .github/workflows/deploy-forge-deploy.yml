# ==============================================================================
# Workflow: Forge — Deploy (k3s Helm workloads)
# ==============================================================================
# Deploys/updates Forge's k3s Helm workloads via strata's own deploy pipeline,
# tunnelled to the k3s API over a temporary SSH connection (see the 'Deploy'
# section below for why — Forge's k3s API has no public LB, only reachable on
# the Hetzner private network or localhost on the node itself).
#
# Prerequisites: deploy-infra.yml and deploy-forge-init.yml must have run
# at least once (VPS exists and is initialised). Pair with
# deploy-forge-config.yml for routine LAN-routing drift correction.
#
# Which Forge namespaces/services actually get deployed is controlled by
# config/stack/workspace.yaml's spec.namespaces list — see the comments there
# for the step-by-step activation order (system -> immich/media -> documents).
# ==============================================================================

name: 33 - Forge - Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Confirm branch to deploy (must match the branch this workflow runs on)"
        type: string
        required: true
      dry_run:
        description: "Dry run (validate + build only, skip the actual Helm deploy)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  STRATA_OUTPUT: json
  STRATA_WORK_PATH: ${{ github.workspace }}
  DEPLOYMENT_FILE: "config/deployment.yaml"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  forge-deploy:
    name: Deploy Forge
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------------
      # Safety: block main branch deployments
      # ------------------------------------------------------------------
      - name: Block deployment from main branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "::error::Deployment from 'main' is blocked. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" = "main" ]; then
            echo "::error::Branch input cannot be 'main'. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" != "${{ github.ref_name }}" ]; then
            echo "::error::Branch input '${{ inputs.branch }}' does not match the running branch '${{ github.ref_name }}'. Re-run from the correct branch."
            exit 1
          fi

      # ------------------------------------------------------------------
      # Network setup — get IP, open SSH on Forge firewall
      # ------------------------------------------------------------------
      - name: Open temporary SSH access
        id: ssh
        uses: ./.github/actions/hetzner-ssh-open
        with:
          hetzner_api_token: ${{ secrets.HETZNER_API_TOKEN }}
          server_name: haven-platform-forge
          firewall_name: haven-platform-fw-forge
          dry_run: ${{ inputs.dry_run }}

      # ------------------------------------------------------------------
      # Strata + Helm setup
      # ------------------------------------------------------------------
      - name: Setup strata
        uses: huybrechtsxyz/strata/.github/actions/setup-strata@v1.8.3
        with:
          # See deploy-infra.yml for why this is '==1.8.3' — also fixes 'strata
          # deploy run' crashing unconditionally on every invocation (v1.7.0-1.8.2),
          # which is exactly the command this workflow's deploy step runs.
          strata-version: "==1.8.3"
        env:
          UV_INDEX_STRATEGY: unsafe-best-match

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Write deploy SSH private key
        if: ${{ inputs.dry_run != true }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_PRIVATE_KEY }}" > ~/.ssh/haven_ed25519
          chmod 600 ~/.ssh/haven_ed25519

      # ------------------------------------------------------------------
      # Deploy (k3s workloads — Helm charts, via strata's own deploy pipeline)
      # ------------------------------------------------------------------
      # Forge's k3s API is only reachable on the Hetzner private network (or
      # localhost on the node itself) — there is no public LB in front of it.
      # Rather than exposing port 6443 on the firewall, this tunnels through
      # the SSH access already opened above: fetch the node's own kubeconfig
      # (a fresh k3s install's default kubeconfig already points at
      # 'https://127.0.0.1:6443', so no rewriting is needed) and forward local
      # port 6443 to the same address on the far end of the SSH connection.
      - name: Validate deployment file
        run: strata validate -f $DEPLOYMENT_FILE --deep

      - name: Build platform artifacts
        run: strata build run --file $DEPLOYMENT_FILE

      - name: Fetch k3s kubeconfig
        if: ${{ inputs.dry_run != true }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/haven_ed25519 \
            root@${{ steps.ssh.outputs.server_ip }}:/etc/rancher/k3s/k3s.yaml \
            /tmp/forge-kubeconfig.yaml
          chmod 600 /tmp/forge-kubeconfig.yaml

      - name: Open SSH tunnel to k3s API
        if: ${{ inputs.dry_run != true }}
        run: |
          ssh -f -N -L 6443:127.0.0.1:6443 \
            -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes \
            -i ~/.ssh/haven_ed25519 root@${{ steps.ssh.outputs.server_ip }}

      # =========================================================================
      # Pre-flight safety net — clear any Helm release stuck in a 'pending-*'
      # state (install/upgrade/rollback) before deploying. This happens when a
      # previous `helm upgrade --wait --atomic --timeout Nm` gets killed rather
      # than exiting cleanly (e.g. a bad image tag causing ImagePullBackOff,
      # --wait blocking until the timeout, then the process being force-killed
      # instead of rolling back) — Helm then refuses to touch that release
      # until it's cleared. Not specific to any one app; runs every deploy.
      # =========================================================================
      - name: Clear any stuck Helm releases (pending-*)
        if: ${{ inputs.dry_run != true }}
        env:
          KUBECONFIG: /tmp/forge-kubeconfig.yaml
        run: |
          helm list --all-namespaces --pending -o json | jq -c '.[]' | while read -r release; do
            name=$(echo "$release" | jq -r '.name')
            namespace=$(echo "$release" | jq -r '.namespace')
            status=$(echo "$release" | jq -r '.status')
            echo "Found stuck release '$name' in namespace '$namespace' (status: $status) — uninstalling."
            helm uninstall "$name" -n "$namespace"
          done

      - name: Deploy Forge Helm apps
        if: ${{ inputs.dry_run != true }}
        env:
          KUBECONFIG: /tmp/forge-kubeconfig.yaml
          # Which namespaces actually get deployed is controlled by
          # config/stack/workspace.yaml's spec.namespaces list (pruned to one
          # at a time for step-by-step activation), not by this stage.
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          strata deploy run --file $DEPLOYMENT_FILE --scope apps --stage applications_forge --force

      # =========================================================================
      # Jellyfin SSO — (re-)register the Authentik OIDC provider with the
      # K0lin/jellyfin-plugin-sso plugin. Idempotent (the plugin's /Add
      # endpoint always overwrites), safe to run on every deploy. Requires
      # JELLYFIN_API_KEY to already exist in Infisical (one-time manual step —
      # see config/forge/modules/jellyfin.yaml's file-level comment; Jellyfin
      # has no headless first-run bootstrap, so this key can only be minted
      # via the web UI). Skips silently (does not fail the deploy) if the key
      # isn't set yet, so this can land before that one-time step is done.
      # Retries briefly since the ingress/cert may need a moment right after
      # a fresh Jellyfin rollout.
      # =========================================================================
      - name: Register Jellyfin SSO provider with Authentik
        if: ${{ inputs.dry_run != true }}
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          set +e
          VALUES=$(strata values get JELLYFIN_API_KEY JELLYFIN_SSO_CLIENT_SECRET -f $DEPLOYMENT_FILE --output json)
          set -e
          JELLYFIN_API_KEY=$(echo "$VALUES" | jq -r '.data.results.JELLYFIN_API_KEY // empty')
          JELLYFIN_SSO_SECRET=$(echo "$VALUES" | jq -r '.data.results.JELLYFIN_SSO_CLIENT_SECRET // empty')

          if [ -z "$JELLYFIN_API_KEY" ]; then
            echo "JELLYFIN_API_KEY not set yet in Infisical — skipping Jellyfin SSO registration (one-time manual step still pending, see config/forge/modules/jellyfin.yaml)."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg secret "$JELLYFIN_SSO_SECRET" \
            '{
              oidEndpoint: "https://auth.huybrechts.xyz/application/o/jellyfin/",
              oidClientId: "jellyfin",
              oidSecret: $secret,
              enabled: true,
              enableAuthorization: true,
              roleClaim: "groups",
              oidScopes: ["groups"],
              adminRoles: ["admins"],
              roles: ["admins", "parents", "members"]
            }')

          for i in 1 2 3 4 5; do
            HTTP=$(curl -s -o /tmp/sso_add.json -w "%{http_code}" -X POST \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://media.huybrechts.xyz/sso/OID/Add/authentik?api_key=$JELLYFIN_API_KEY")
            if [ "$HTTP" -lt 400 ]; then
              echo "Jellyfin SSO provider registered successfully (HTTP $HTTP)."
              exit 0
            fi
            echo "Attempt $i failed (HTTP $HTTP), retrying in 10s..."
            cat /tmp/sso_add.json || true
            sleep 10
          done
          echo "::warning::Failed to register Jellyfin SSO provider after 5 attempts (last HTTP $HTTP) — not failing the deploy, check manually."

      # =========================================================================
      # Diagnostics on failure — the deploy step above uses `helm --wait
      # --atomic --timeout`, which on failure is force-killed by strata's
      # subprocess wrapper rather than exiting cleanly, so its own stderr
      # rarely contains the real Kubernetes-level reason (ImagePullBackOff,
      # CrashLoopBackOff, unbound PVC, etc.). Dump live cluster state here so
      # failures are actually diagnosable from the workflow log.
      # =========================================================================
      - name: Dump pod diagnostics on failure
        if: ${{ failure() && inputs.dry_run != true }}
        env:
          KUBECONFIG: /tmp/forge-kubeconfig.yaml
        run: |
          for ns in system immich media documents; do
            echo "::group::Pods in namespace: $ns"
            kubectl get pods -n "$ns" -o wide 2>/dev/null || true
            echo "::endgroup::"
          done
          echo "::group::Describe + logs for crashing/unready containers"
          kubectl get pods -A -o json 2>/dev/null \
            | jq -r '
                .items[]
                | select(
                    (.status.containerStatuses // [])
                    | any(
                        .restartCount > 0
                        or (.state.waiting != null)
                        or ((.state.terminated.reason // "") as $r | ($r != "" and $r != "Completed"))
                      )
                  )
                | "\(.metadata.namespace)/\(.metadata.name)"
              ' \
            | while read -r pod; do
                ns="${pod%%/*}"; name="${pod##*/}"
                echo "--- describe $ns/$name ---"
                kubectl describe pod "$name" -n "$ns" || true
                echo "--- logs $ns/$name (current) ---"
                kubectl logs "$name" -n "$ns" --all-containers --tail=200 || true
                echo "--- logs $ns/$name (previous, if crashed) ---"
                kubectl logs "$name" -n "$ns" --all-containers --previous --tail=200 2>/dev/null || true
                echo "--- recent events ($ns) ---"
                kubectl get events -n "$ns" --sort-by='.lastTimestamp' 2>/dev/null | tail -n 20 || true
              done
          echo "::endgroup::"

      - name: Close SSH tunnel to k3s API
        if: ${{ always() }}
        run: pkill -f "6443:127.0.0.1:6443" || true

      # ------------------------------------------------------------------
      # Cleanup — always remove temporary SSH rule
      # ------------------------------------------------------------------
      - name: Close temporary SSH access
        if: ${{ always() }}
        uses: ./.github/actions/hetzner-ssh-close
        with:
          hetzner_api_token: ${{ secrets.HETZNER_API_TOKEN }}
          firewall_id: ${{ steps.ssh.outputs.firewall_id }}
          dry_run: ${{ inputs.dry_run }}

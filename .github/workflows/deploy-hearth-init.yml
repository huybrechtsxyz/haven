# ==============================================================================
# Workflow: Hearth — Init (one-time server bootstrap)
# ==============================================================================
# One-time initialisation of a fresh Hearth VPS: creates the deploy user,
# installs Docker, configures system settings, and generates the BorgBackup
# SSH key pair. Idempotent (safe to re-run) but normally only needed once per
# server — routine changes go through deploy-hearth-config.yml and
# deploy-hearth-deploy.yml instead.
#
# Prerequisites: deploy-infra.yml must have run at least once (VPS exists).
# ==============================================================================

name: 21 - Hearth - Init

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Confirm branch to deploy (must match the branch this workflow runs on)"
        type: string
        required: true
      dry_run:
        description: "Dry run (skip playbook execution)"
        type: boolean
        default: false
      configure_borg:
        description: "Initialise BorgBackup repo on Storage Box (run only after SSH key is authorised in Hetzner Robot)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  STRATA_OUTPUT: json
  DEPLOYMENT_FILE: "config/deployment.yaml"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  hearth-init:
    name: Init Hearth
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------------
      # Safety: block main branch deployments
      # ------------------------------------------------------------------
      - name: Block deployment from main branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "::error::Deployment from 'main' is blocked. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" = "main" ]; then
            echo "::error::Branch input cannot be 'main'. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" != "${{ github.ref_name }}" ]; then
            echo "::error::Branch input '${{ inputs.branch }}' does not match the running branch '${{ github.ref_name }}'. Re-run from the correct branch."
            exit 1
          fi

      # ------------------------------------------------------------------
      # Network setup — get IP, open SSH on Hearth firewall
      # ------------------------------------------------------------------
      - name: Open temporary SSH access
        id: ssh
        uses: ./.github/actions/hetzner-ssh-open
        with:
          hetzner_api_token: ${{ secrets.HETZNER_API_TOKEN }}
          server_name: haven-platform-hearth
          firewall_name: haven-platform-fw-hearth
          dry_run: ${{ inputs.dry_run }}

      # ------------------------------------------------------------------
      # Ansible setup
      # ------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ansible
        if: ${{ inputs.dry_run != true }}
        run: pip install ansible-core

      - name: Install strata
        if: ${{ inputs.dry_run != true }}
        run: pip install "xyz-strata==1.6.1"

      - name: Write deploy SSH private key
        if: ${{ inputs.dry_run != true }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_PRIVATE_KEY }}" > ~/.ssh/haven_ed25519
          chmod 600 ~/.ssh/haven_ed25519

      - name: Install Ansible collections
        if: ${{ inputs.dry_run != true }}
        working-directory: deploy/ansible-hearth
        run: ansible-galaxy collection install -r requirements.yml -p ./collections

      # ------------------------------------------------------------------
      # Init (one-time server initialisation)
      # ------------------------------------------------------------------
      - name: Write Ansible vars file for borg init
        if: ${{ inputs.configure_borg == true && inputs.dry_run != true }}
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          VALUES=$(strata values get BORG_PASSPHRASE_HEARTH STORAGEBOX_HEARTH_PASSWORD -f $DEPLOYMENT_FILE --output json)
          BORG_PASSPHRASE=$(echo "$VALUES" | jq -r '.data.results.BORG_PASSPHRASE_HEARTH')
          STORAGEBOX_PASSWORD=$(echo "$VALUES" | jq -r '.data.results.STORAGEBOX_HEARTH_PASSWORD')
          cat > /tmp/init_vars.yml << VARSEOF
          configure_borg: true
          storagebox_host: "${{ vars.STORAGEBOX_HOST }}"
          storagebox_subaccount: "${{ vars.STORAGEBOX_SUBACCOUNT_HEARTH }}"
          borg_passphrase: "$BORG_PASSPHRASE"
          storagebox_password: "$STORAGEBOX_PASSWORD"
          VARSEOF

      - name: Run hearth-init playbook
        if: ${{ inputs.dry_run != true }}
        working-directory: deploy/ansible-hearth
        run: |
          if [ "${{ inputs.configure_borg }}" = "true" ]; then
            EXTRA_ARGS="-e @/tmp/init_vars.yml"
          else
            EXTRA_ARGS="-e configure_borg=false"
          fi
          ansible-playbook hearth-init.yml \
            -i "${{ steps.ssh.outputs.server_ip }}," \
            --private-key ~/.ssh/haven_ed25519 \
            $EXTRA_ARGS

      - name: Clean up init vars file
        if: ${{ always() && inputs.configure_borg == true && inputs.dry_run != true }}
        run: rm -f /tmp/init_vars.yml

      # ------------------------------------------------------------------
      # Cleanup — always remove temporary SSH rule
      # ------------------------------------------------------------------
      - name: Close temporary SSH access
        if: ${{ always() }}
        uses: ./.github/actions/hetzner-ssh-close
        with:
          hetzner_api_token: ${{ secrets.HETZNER_API_TOKEN }}
          firewall_id: ${{ steps.ssh.outputs.firewall_id }}
          dry_run: ${{ inputs.dry_run }}

# ==============================================================================
# Workflow: Infrastructure — Terraform
# ==============================================================================
# Provisions shared infrastructure (VPS, network, firewall).
# No SSH access needed — this is API-only.
#
# Run order (full stack from scratch):
#   1. deploy-infra.yml   (this file — terraform)
#   2. deploy-hearth-init.yml / deploy-hearth-config.yml / deploy-hearth-deploy.yml
#      (server init + config + Docker Compose deploy)
#   3. deploy-forge-init.yml / deploy-forge-config.yml / deploy-forge-deploy.yml
#      (server init + config + k3s Helm deploy)
# ==============================================================================

name: 10 - Infra - haven

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Confirm branch to deploy (must match the branch this workflow runs on)"
        type: string
        required: true
      dry_run:
        description: "Dry run (plan only, no apply)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  STRATA_OUTPUT: json
  STRATA_WORK_PATH: ${{ github.workspace }}
  DEPLOYMENT: haven_deploy_prd
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  infra:
    name: Provision infrastructure
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------------
      # Safety: block main branch deployments
      # ------------------------------------------------------------------
      - name: Block deployment from main branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "::error::Deployment from 'main' is blocked. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" = "main" ]; then
            echo "::error::Branch input cannot be 'main'. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" != "${{ github.ref_name }}" ]; then
            echo "::error::Branch input '${{ inputs.branch }}' does not match the running branch '${{ github.ref_name }}'. Re-run from the correct branch."
            exit 1
          fi

      # ------------------------------------------------------------------
      # Install tools
      # ------------------------------------------------------------------
      - name: Setup tools (VERSIONS.env)
        uses: ./.github/actions/setup-tools
        with:
          terraform: "true"

      # ------------------------------------------------------------------
      # Validate
      # ------------------------------------------------------------------
      - name: Validate deployment file
        run: |
          strata validate --strict

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build platform artifacts
        run: |
          strata build run "$DEPLOYMENT"

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: platform-build
          path: build/
          retention-days: 14

      # ------------------------------------------------------------------
      # Deploy infrastructure (Terraform)
      # ------------------------------------------------------------------
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: platform-build
          path: build/

      - name: Deploy infrastructure
        env:
          # Terraform Cloud auth (read directly by the terraform/tofu CLI — not a strata-resolved secret)
          TERRAFORM_API_TOKEN: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
          # Infisical Cloud machine identity — lets strata resolve every `store: infisical`
          # secret declared in config/environments/prd.yaml at deploy time. strata sets
          # TF_VAR_<key> for every resolved value; deploy/terraform/strata.tf declares the
          # ones the root uses. No manual TF_VAR_* wiring needed here.
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          # --scope infra restricts this run to the `infrastructure` step (the one
          # Terraform root for both VMs). This workflow is API-only (no
          # SSH/kubeconfig), so it must never pick up applications_forge
          # (scope: apps) or applications_hearth (scope: hearth, build-only).
          ARGS="$DEPLOYMENT --scope infra"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          strata deploy run $ARGS

      - name: Show terraform plan (human-readable)
        env:
          # terraform show re-reads provider schemas via the cloud {} backend, same auth as plan/apply
          TERRAFORM_API_TOKEN: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
        run: |
          TF_DIR=$(find build -type d -name terraform | head -n1)
          if [ -z "$TF_DIR" ]; then
            echo "No terraform build directory found — skipping plan display."
            exit 0
          fi
          cd "$TF_DIR"
          shopt -s nullglob
          for f in *.tfplan; do
            echo "::group::Terraform plan — $f"
            terraform show "$f"
            echo "::endgroup::"
          done

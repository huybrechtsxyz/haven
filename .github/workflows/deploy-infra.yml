# ==============================================================================
# Workflow: Infrastructure — Terraform + S3 buckets
# ==============================================================================
# Provisions shared infrastructure (VPS, network, firewall, S3 buckets).
# No SSH access needed — this is API-only.
#
# Run order (full stack from scratch):
#   1. deploy-infra.yml   (this file — terraform + S3)
#   2. deploy-hearth-init.yml / deploy-hearth-config.yml / deploy-hearth-deploy.yml
#      (server init + config + Docker Compose deploy)
#   3. deploy-forge.yml   (server init + config + k3s deploy)
# ==============================================================================

name: 10 - Infra - haven

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Confirm branch to deploy (must match the branch this workflow runs on)"
        type: string
        required: true
      dry_run:
        description: "Dry run (plan only, no apply)"
        type: boolean
        default: false
      stage:
        description: "Limit to a specific stage (empty = all)"
        type: string
        required: false
      run_s3:
        description: "Create/update S3 buckets (photos, media, archive, docs) — idempotent, safe to re-run"
        type: boolean
        default: false

permissions:
  contents: read

env:
  STRATA_OUTPUT: json
  STRATA_WORK_PATH: ${{ github.workspace }}
  DEPLOYMENT_FILE: "config/deployment.yaml"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  infra:
    name: Provision infrastructure
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------------
      # Safety: block main branch deployments
      # ------------------------------------------------------------------
      - name: Block deployment from main branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "::error::Deployment from 'main' is blocked. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" = "main" ]; then
            echo "::error::Branch input cannot be 'main'. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" != "${{ github.ref_name }}" ]; then
            echo "::error::Branch input '${{ inputs.branch }}' does not match the running branch '${{ github.ref_name }}'. Re-run from the correct branch."
            exit 1
          fi

      # ------------------------------------------------------------------
      # Install tools
      # ------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install strata
        run: pip install "xyz-strata==1.6.1"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # ------------------------------------------------------------------
      # Validate
      # ------------------------------------------------------------------
      - name: Validate deployment file
        run: |
          strata validate -f $DEPLOYMENT_FILE --deep

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build platform artifacts
        run: |
          strata build run --file $DEPLOYMENT_FILE

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: platform-build
          path: build/
          retention-days: 14

      # ------------------------------------------------------------------
      # Deploy infrastructure (Terraform)
      # ------------------------------------------------------------------
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: platform-build
          path: build/

      - name: Deploy infrastructure
        env:
          # Terraform Cloud auth (read directly by the terraform/tofu CLI — not a strata-resolved secret)
          TERRAFORM_API_TOKEN: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
          # Infisical Cloud machine identity — lets strata resolve every `store: infisical`
          # secret declared in config/environment.yaml at deploy time. The terraform deployer
          # auto-injects each resolved secret as TF_VAR_<key> before plan/apply/destroy — no
          # manual TF_VAR_* wiring needed here (see strata's inject_tf_vars()).
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          ARGS="--file $DEPLOYMENT_FILE --force"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.stage }}" ]; then
            ARGS="$ARGS --stage ${{ inputs.stage }}"
          fi
          strata deploy run $ARGS

      - name: Show terraform plan (human-readable)
        env:
          # terraform show re-reads provider schemas via the cloud {} backend, same auth as plan/apply
          TERRAFORM_API_TOKEN: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
        run: |
          TF_DIR=$(find build -type d -name terraform | head -n1)
          if [ -z "$TF_DIR" ]; then
            echo "No terraform build directory found — skipping plan display."
            exit 0
          fi
          cd "$TF_DIR"
          shopt -s nullglob
          for f in *.tfplan; do
            echo "::group::Terraform plan — $f"
            terraform show "$f"
            echo "::endgroup::"
          done

      # ------------------------------------------------------------------
      # S3 bucket provisioning (run_s3=true)
      # Creates Hetzner Object Storage buckets — idempotent, no SSH needed.
      # ------------------------------------------------------------------
      - name: Install Ansible + boto3 (S3)
        if: ${{ inputs.run_s3 == true && inputs.dry_run != true }}
        run: pip install ansible-core boto3 botocore

      - name: Install Ansible collections (S3)
        if: ${{ inputs.run_s3 == true && inputs.dry_run != true }}
        working-directory: deploy/ansible-s3
        run: ansible-galaxy collection install -r requirements.yml -p ./collections

      - name: Run forge-s3 playbook
        if: ${{ inputs.run_s3 == true && inputs.dry_run != true }}
        working-directory: deploy/ansible-s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
        run: ansible-playbook forge-s3.yml

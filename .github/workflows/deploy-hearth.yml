# ==============================================================================
# Workflow: Hearth — Config + Deploy (Docker Compose)
# ==============================================================================
# Manages the Hearth VPS: init, config enforcement, Docker Compose deploy.
# Temporarily opens SSH on the Hearth firewall for the runner IP, runs
# the selected Ansible playbooks, then always removes the rule.
#
# Prerequisites: deploy-infra.yml must have run at least once (VPS exists).
# ==============================================================================

name: Hearth - haven

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Confirm branch to deploy (must match the branch this workflow runs on)"
        type: string
        required: true
      dry_run:
        description: "Dry run (skip playbook execution)"
        type: boolean
        default: false
      run_init:
        description: "Run one-time server initialisation (hearth-init Ansible playbook)"
        type: boolean
        default: false
      configure_borg:
        description: "Initialise BorgBackup repo on Storage Box (run only after SSH key is authorised in Hetzner Robot)"
        type: boolean
        default: false
      run_config:
        description: "Run idempotent configuration enforcement (hearth-config Ansible playbook)"
        type: boolean
        default: true
      run_deploy:
        description: "Deploy Docker Compose services to Hearth (hearth-deploy Ansible playbook)"
        type: boolean
        default: true
      full_restart:
        description: "Stop ALL containers before deploying (clean restart — use when containers have stale state)"
        type: boolean
        default: false
      backup_before_deploy:
        description: "Run a BorgBackup snapshot before deploying (requires configure_borg=true on server)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  STRATA_OUTPUT: json
  DEPLOYMENT_FILE: "config/deployment.yaml"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  hearth:
    name: Deploy Hearth
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------------
      # Safety: block main branch deployments
      # ------------------------------------------------------------------
      - name: Block deployment from main branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "::error::Deployment from 'main' is blocked. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" = "main" ]; then
            echo "::error::Branch input cannot be 'main'. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" != "${{ github.ref_name }}" ]; then
            echo "::error::Branch input '${{ inputs.branch }}' does not match the running branch '${{ github.ref_name }}'. Re-run from the correct branch."
            exit 1
          fi

      # ------------------------------------------------------------------
      # Network setup — get IPs, open SSH on Hearth firewall
      # ------------------------------------------------------------------
      - name: Get runner public IP
        id: runner_ip
        run: echo "ip=$(curl -sf https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Get Hearth server public IP
        id: hearth_ip
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          ip=$(curl -sf \
            -H "Authorization: Bearer $HETZNER_API_TOKEN" \
            "https://api.hetzner.cloud/v1/servers?name=haven-platform-hearth" \
            | jq -r '.servers[0].public_net.ipv4.ip')
          if [ -z "$ip" ] || [ "$ip" = "null" ]; then
            echo "::error::Hearth server not found. Run deploy-infra.yml first."
            exit 1
          fi
          echo "ip=$ip" >> $GITHUB_OUTPUT

      - name: Get Hearth firewall ID
        id: fw
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer $HETZNER_API_TOKEN" \
            "https://api.hetzner.cloud/v1/firewalls?name=haven-platform-fw-hearth")
          id=$(echo "$RESPONSE" | jq -r '.firewalls[0].id // empty')
          if [ -z "$id" ]; then
            echo "::error::Firewall 'haven-platform-fw-hearth' not found."
            curl -sf -H "Authorization: Bearer $HETZNER_API_TOKEN" \
              "https://api.hetzner.cloud/v1/firewalls" | jq -r '.firewalls[].name'
            exit 1
          fi
          echo "id=$id" >> $GITHUB_OUTPUT

      - name: Open temporary SSH rule for runner
        if: ${{ inputs.dry_run != true }}
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          FW_ID="${{ steps.fw.outputs.id }}"
          RUNNER_IP="${{ steps.runner_ip.outputs.ip }}/32"
          RUN_ID="${{ github.run_id }}"
          CURRENT=$(curl -sf \
            -H "Authorization: Bearer $HETZNER_API_TOKEN" \
            "https://api.hetzner.cloud/v1/firewalls/$FW_ID")
          PAYLOAD=$(echo "$CURRENT" | jq \
            --arg ip "$RUNNER_IP" \
            --arg run "$RUN_ID" \
            '{rules: (.firewall.rules + [{direction:"in",protocol:"tcp",port:"22",source_ips:[$ip],description:("CI hearth SSH run-"+$run)}])}')
          HTTP=$(curl -s -o /tmp/fw_set.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $HETZNER_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.hetzner.cloud/v1/firewalls/$FW_ID/actions/set_rules" \
            -d "$PAYLOAD")
          cat /tmp/fw_set.json
          [ "$HTTP" -lt 400 ]

      # ------------------------------------------------------------------
      # Ansible setup
      # ------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ansible
        if: ${{ inputs.dry_run != true }}
        run: pip install ansible-core

      - name: Install strata
        if: ${{ inputs.dry_run != true }}
        run: pip install "xyz-strata==1.6.1"

      - name: Write deploy SSH private key
        if: ${{ inputs.dry_run != true }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_PRIVATE_KEY }}" > ~/.ssh/haven_ed25519
          chmod 600 ~/.ssh/haven_ed25519

      # ------------------------------------------------------------------
      # Init (one-time server initialisation)
      # ------------------------------------------------------------------
      - name: Install Ansible collections
        if: ${{ (inputs.run_init == true || inputs.run_config == true) && inputs.dry_run != true }}
        working-directory: deploy/ansible-hearth
        run: ansible-galaxy collection install -r requirements.yml -p ./collections

      - name: Write Ansible vars file for borg init
        if: ${{ inputs.run_init == true && inputs.configure_borg == true && inputs.dry_run != true }}
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          VALUES=$(strata values get BORG_PASSPHRASE_HEARTH STORAGEBOX_HEARTH_PASSWORD -f $DEPLOYMENT_FILE --output json)
          BORG_PASSPHRASE=$(echo "$VALUES" | jq -r '.data.results.BORG_PASSPHRASE_HEARTH')
          STORAGEBOX_PASSWORD=$(echo "$VALUES" | jq -r '.data.results.STORAGEBOX_HEARTH_PASSWORD')
          cat > /tmp/init_vars.yml << VARSEOF
          configure_borg: true
          storagebox_host: "${{ vars.STORAGEBOX_HOST }}"
          storagebox_subaccount: "${{ vars.STORAGEBOX_SUBACCOUNT_HEARTH }}"
          borg_passphrase: "$BORG_PASSPHRASE"
          storagebox_password: "$STORAGEBOX_PASSWORD"
          VARSEOF

      - name: Run hearth-init playbook
        if: ${{ inputs.run_init == true && inputs.dry_run != true }}
        working-directory: deploy/ansible-hearth
        run: |
          if [ "${{ inputs.configure_borg }}" = "true" ]; then
            EXTRA_ARGS="-e @/tmp/init_vars.yml"
          else
            EXTRA_ARGS="-e configure_borg=false"
          fi
          ansible-playbook hearth-init.yml \
            -i "${{ steps.hearth_ip.outputs.ip }}," \
            --private-key ~/.ssh/haven_ed25519 \
            $EXTRA_ARGS

      - name: Clean up init vars file
        if: ${{ always() && inputs.run_init == true && inputs.configure_borg == true && inputs.dry_run != true }}
        run: rm -f /tmp/init_vars.yml

      # ------------------------------------------------------------------
      # Config (idempotent configuration enforcement)
      # ------------------------------------------------------------------
      - name: Write Ansible vars file for config secrets
        if: ${{ inputs.run_config == true && inputs.dry_run != true }}
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          VALUES=$(strata values get BORG_PASSPHRASE_HEARTH HEALTHCHECK_PING_BACKUP VAULTWARDEN_SSO_CLIENT_SECRET WUD_SSO_CLIENT_SECRET -f $DEPLOYMENT_FILE --output json)
          BORG_PASSPHRASE=$(echo "$VALUES" | jq -r '.data.results.BORG_PASSPHRASE_HEARTH')
          HEALTHCHECK_URL=$(echo "$VALUES" | jq -r '.data.results.HEALTHCHECK_PING_BACKUP')
          VAULTWARDEN_SSO_SECRET=$(echo "$VALUES" | jq -r '.data.results.VAULTWARDEN_SSO_CLIENT_SECRET')
          WUD_SSO_SECRET=$(echo "$VALUES" | jq -r '.data.results.WUD_SSO_CLIENT_SECRET')
          cat > /tmp/config_vars.yml << VARSEOF
          borg_passphrase: "$BORG_PASSPHRASE"
          storagebox_host: "${{ vars.STORAGEBOX_HOST }}"
          storagebox_subaccount: "${{ vars.STORAGEBOX_SUBACCOUNT_HEARTH }}"
          healthcheck_ping_url: "$HEALTHCHECK_URL"
          vaultwarden_sso_client_secret: "$VAULTWARDEN_SSO_SECRET"
          wud_sso_client_secret: "$WUD_SSO_SECRET"
          VARSEOF

      - name: Run hearth-config playbook
        if: ${{ inputs.run_config == true && inputs.dry_run != true }}
        working-directory: deploy/ansible-hearth
        run: |
          ansible-playbook hearth-config.yml \
            -i "${{ steps.hearth_ip.outputs.ip }}," \
            --private-key ~/.ssh/haven_ed25519 \
            -e @/tmp/config_vars.yml

      - name: Clean up config vars file
        if: ${{ always() && inputs.run_config == true && inputs.dry_run != true }}
        run: rm -f /tmp/config_vars.yml

      # ------------------------------------------------------------------
      # Full restart (optional — clean slate before redeploy)
      # ------------------------------------------------------------------
      - name: Stop all haven containers
        if: ${{ inputs.full_restart == true && inputs.dry_run != true }}
        run: |
          ssh -i ~/.ssh/haven_ed25519 -o StrictHostKeyChecking=no \
            root@${{ steps.hearth_ip.outputs.ip }} \
            "docker compose --project-name haven -f /opt/haven/etc/docker-compose.yml down || true"

      # ------------------------------------------------------------------
      # Pre-deploy backup (optional)
      # ------------------------------------------------------------------
      - name: Run pre-deploy backup
        if: ${{ inputs.backup_before_deploy == true && inputs.run_deploy == true && inputs.dry_run != true }}
        run: |
          ansible all \
            -i "${{ steps.hearth_ip.outputs.ip }}," \
            -u root \
            --private-key ~/.ssh/haven_ed25519 \
            -m command \
            -a "/opt/haven/scripts/backup.sh"

      # ------------------------------------------------------------------
      # Deploy (Docker Compose services)
      # ------------------------------------------------------------------
      - name: Write Ansible vars file for deploy secrets
        if: ${{ inputs.run_deploy == true && inputs.dry_run != true }}
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          VALUES=$(strata values get AUTHENTIK_SECRET_KEY AUTHENTIK_POSTGRESQL__PASSWORD VAULTWARDEN_ADMIN_ARGON VAULTWARDEN_SSO_CLIENT_SECRET WUD_SSO_CLIENT_SECRET -f $DEPLOYMENT_FILE --output json)
          AUTHENTIK_KEY=$(echo "$VALUES" | jq -r '.data.results.AUTHENTIK_SECRET_KEY')
          AUTHENTIK_DB_PASSWORD=$(echo "$VALUES" | jq -r '.data.results.AUTHENTIK_POSTGRESQL__PASSWORD')
          VAULTWARDEN_TOKEN=$(echo "$VALUES" | jq -r '.data.results.VAULTWARDEN_ADMIN_ARGON')
          VAULTWARDEN_SSO_SECRET=$(echo "$VALUES" | jq -r '.data.results.VAULTWARDEN_SSO_CLIENT_SECRET')
          WUD_SSO_SECRET=$(echo "$VALUES" | jq -r '.data.results.WUD_SSO_CLIENT_SECRET')
          cat > /tmp/deploy_vars.yml << VARSEOF
          authentik_secret_key: "$AUTHENTIK_KEY"
          authentik_postgresql_password: "$AUTHENTIK_DB_PASSWORD"
          vaultwarden_admin_token: "$VAULTWARDEN_TOKEN"
          vaultwarden_sso_client_secret: "$VAULTWARDEN_SSO_SECRET"
          wud_sso_client_secret: "$WUD_SSO_SECRET"
          VARSEOF

      - name: Run hearth-deploy playbook
        if: ${{ inputs.run_deploy == true && inputs.dry_run != true }}
        working-directory: deploy/ansible-hearth
        run: |
          ansible-playbook hearth-deploy.yml \
            -i "${{ steps.hearth_ip.outputs.ip }}," \
            --private-key ~/.ssh/haven_ed25519 \
            -e full_restart=${{ inputs.full_restart }} \
            -e @/tmp/deploy_vars.yml

      - name: Clean up deploy vars file
        if: ${{ always() && inputs.run_deploy == true && inputs.dry_run != true }}
        run: rm -f /tmp/deploy_vars.yml

      # ------------------------------------------------------------------
      # Cleanup — always remove temporary SSH rule
      # ------------------------------------------------------------------
      - name: Remove temporary SSH rule for runner
        if: ${{ always() && inputs.dry_run != true }}
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          FW_ID="${{ steps.fw.outputs.id }}"
          RUN_ID="${{ github.run_id }}"
          CURRENT=$(curl -sf \
            -H "Authorization: Bearer $HETZNER_API_TOKEN" \
            "https://api.hetzner.cloud/v1/firewalls/$FW_ID")
          PAYLOAD=$(echo "$CURRENT" | jq \
            --arg run "$RUN_ID" \
            '{rules: [.firewall.rules[] | select(.description != ("CI hearth SSH run-"+$run))]}')
          curl -s -X POST \
            -H "Authorization: Bearer $HETZNER_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.hetzner.cloud/v1/firewalls/$FW_ID/actions/set_rules" \
            -d "$PAYLOAD" || true

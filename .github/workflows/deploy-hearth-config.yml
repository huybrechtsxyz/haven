# ==============================================================================
# Workflow: Hearth — Config (idempotent configuration enforcement)
# ==============================================================================
# Runs on every routine deploy (paired with deploy-hearth-deploy.yml): stops
# competing web servers, applies security updates, enforces SSH hardening,
# deploys the BorgBackup script + cron, and (re-)applies the Authentik SSO
# blueprint. Safe to re-run — corrects drift without touching containers.
#
# Prerequisites: deploy-hearth-init.yml must have run at least once.
# ==============================================================================

name: 22 - Hearth - Config

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Confirm branch to deploy (must match the branch this workflow runs on)"
        type: string
        required: true
      dry_run:
        description: "Dry run (skip playbook execution)"
        type: boolean
        default: false
      configure_borg:
        description: "Deploy/refresh the BorgBackup script, cron job, and passphrase file (leave true once Borg has been initialised via deploy-hearth-init.yml)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  STRATA_OUTPUT: json
  DEPLOYMENT_FILE: "config/deployment.yaml"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  hearth-config:
    name: Config Hearth
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ------------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------------
      # Safety: block main branch deployments
      # ------------------------------------------------------------------
      - name: Block deployment from main branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "::error::Deployment from 'main' is blocked. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" = "main" ]; then
            echo "::error::Branch input cannot be 'main'. Use a feature branch."
            exit 1
          fi
          if [ "${{ inputs.branch }}" != "${{ github.ref_name }}" ]; then
            echo "::error::Branch input '${{ inputs.branch }}' does not match the running branch '${{ github.ref_name }}'. Re-run from the correct branch."
            exit 1
          fi

      # ------------------------------------------------------------------
      # Network setup — get IP, open SSH on Hearth firewall
      # ------------------------------------------------------------------
      - name: Open temporary SSH access
        id: ssh
        uses: ./.github/actions/hetzner-ssh-open
        with:
          hetzner_api_token: ${{ secrets.HETZNER_API_TOKEN }}
          server_name: haven-platform-hearth
          firewall_name: haven-platform-fw-hearth
          dry_run: ${{ inputs.dry_run }}

      # ------------------------------------------------------------------
      # Ansible setup
      # ------------------------------------------------------------------
      - name: Setup strata
        if: ${{ inputs.dry_run != true }}
        uses: huybrechtsxyz/strata/.github/actions/setup-strata@v1.8.3
        with:
          # See deploy-infra.yml for why this is '==1.8.3' — also fixes 'strata
          # deploy run' crashing unconditionally on every invocation (v1.7.0-1.8.2).
          strata-version: "==1.8.3"
        env:
          # See deploy-infra.yml for why this is set — no-op on GitHub-hosted runners.
          UV_INDEX_STRATEGY: unsafe-best-match

      - name: Install Ansible
        if: ${{ inputs.dry_run != true }}
        run: pip install ansible-core

      - name: Write deploy SSH private key
        if: ${{ inputs.dry_run != true }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_PRIVATE_KEY }}" > ~/.ssh/haven_ed25519
          chmod 600 ~/.ssh/haven_ed25519

      - name: Install Ansible collections
        if: ${{ inputs.dry_run != true }}
        working-directory: deploy/ansible-hearth
        run: ansible-galaxy collection install -r requirements.yml -p ./collections

      # ------------------------------------------------------------------
      # Config (idempotent configuration enforcement)
      # ------------------------------------------------------------------
      - name: Write Ansible vars file for config secrets
        if: ${{ inputs.dry_run != true }}
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          set +e
          VALUES=$(strata values get BORG_PASSPHRASE_HEARTH HEALTHCHECK_PING_HEARTH VAULTWARDEN_SSO_CLIENT_SECRET WUD_SSO_CLIENT_SECRET JELLYFIN_SSO_CLIENT_SECRET NEXTCLOUD_SSO_CLIENT_SECRET IMMICH_SSO_CLIENT_SECRET -f $DEPLOYMENT_FILE --output json)
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "::error::strata values get failed (exit $STATUS). Non-sensitive error detail:"
            echo "$VALUES" | jq -r '.errors[]?' 2>/dev/null || echo "(no parseable error detail)"
            exit $STATUS
          fi
          BORG_PASSPHRASE=$(echo "$VALUES" | jq -r '.data.results.BORG_PASSPHRASE_HEARTH')
          HEALTHCHECK_URL=$(echo "$VALUES" | jq -r '.data.results.HEALTHCHECK_PING_HEARTH')
          VAULTWARDEN_SSO_SECRET=$(echo "$VALUES" | jq -r '.data.results.VAULTWARDEN_SSO_CLIENT_SECRET')
          WUD_SSO_SECRET=$(echo "$VALUES" | jq -r '.data.results.WUD_SSO_CLIENT_SECRET')
          JELLYFIN_SSO_SECRET=$(echo "$VALUES" | jq -r '.data.results.JELLYFIN_SSO_CLIENT_SECRET')
          NEXTCLOUD_SSO_SECRET=$(echo "$VALUES" | jq -r '.data.results.NEXTCLOUD_SSO_CLIENT_SECRET')
          IMMICH_SSO_SECRET=$(echo "$VALUES" | jq -r '.data.results.IMMICH_SSO_CLIENT_SECRET')
          cat > /tmp/config_vars.yml << VARSEOF
          borg_passphrase: "$BORG_PASSPHRASE"
          storagebox_host: "${{ vars.STORAGEBOX_HOST }}"
          storagebox_subaccount: "${{ vars.STORAGEBOX_SUBACCOUNT_HEARTH }}"
          healthcheck_ping_url: "$HEALTHCHECK_URL"
          vaultwarden_sso_client_secret: "$VAULTWARDEN_SSO_SECRET"
          wud_sso_client_secret: "$WUD_SSO_SECRET"
          jellyfin_sso_client_secret: "$JELLYFIN_SSO_SECRET"
          nextcloud_sso_client_secret: "$NEXTCLOUD_SSO_SECRET"
          immich_sso_client_secret: "$IMMICH_SSO_SECRET"
          VARSEOF

      - name: Run hearth-config playbook
        if: ${{ inputs.dry_run != true }}
        working-directory: deploy/ansible-hearth
        run: |
          ansible-playbook hearth-config.yml \
            -i "${{ steps.ssh.outputs.server_ip }}," \
            --private-key ~/.ssh/haven_ed25519 \
            -e configure_borg=${{ inputs.configure_borg }} \
            -e @/tmp/config_vars.yml

      - name: Clean up config vars file
        if: ${{ always() && inputs.dry_run != true }}
        run: rm -f /tmp/config_vars.yml

      # ------------------------------------------------------------------
      # Cleanup — always remove temporary SSH rule
      # ------------------------------------------------------------------
      - name: Close temporary SSH access
        if: ${{ always() }}
        uses: ./.github/actions/hetzner-ssh-close
        with:
          hetzner_api_token: ${{ secrets.HETZNER_API_TOKEN }}
          firewall_id: ${{ steps.ssh.outputs.firewall_id }}
          dry_run: ${{ inputs.dry_run }}

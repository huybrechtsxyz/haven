---
# =============================================================================
# Playbook: forge-init.yml
# One-time initialisation of the Forge VPS after terraform provisions it.
# Idempotent — safe to re-run — but normally only needed once per server.
# Routine changes go through forge-config.yml / forge-deploy.yml instead
# (once those exist).
#
# SSH CONNECTIVITY NOTE:
#   The Hetzner Cloud Firewall restricts SSH to the private network (10.0.0.0/8).
#
#   Via pipeline (recommended):
#     deploy-forge-init.yml handles this automatically: it opens a temporary
#     SSH rule scoped to the runner's IP before running this playbook, and
#     always removes it afterwards (even on failure).
#
#   Manually:
#     a) Temporarily add your public IP to the Hetzner firewall via the console
#        (Security -> Firewalls -> haven-platform-fw-forge -> Add rule: TCP 22 from <your-ip>)
#        and remove it after the playbook completes.
#     b) Run from within the Hetzner private network (e.g. via Hearth).
#     c) Use Tailscale (future - see hosting-design.md paragraph Future considerations).
#
# Install collections first (once):
#   ansible-galaxy collection install -r requirements.yml -p ./collections
#
# Run (two-step for BorgBackup):
#
#   Step 1 - full init, borg key generation only (no borg repo init):
#     ansible-playbook forge-init.yml \
#       --private-key ~/.ssh/haven_ed25519 \
#       -e forge_host=<public_ip>
#
#   Step 2 - after authorising the borg key on the haven-backup Storage Box
#   sub-account in Hetzner Robot:
#     ansible-playbook forge-init.yml \
#       --private-key ~/.ssh/haven_ed25519 \
#       -e forge_host=<public_ip> \
#       -e configure_borg=true \
#       -e storagebox_backup_host=<uXXXXXX.your-storagebox.de> \
#       -e storagebox_backup_password=<storagebox-password> \
#       -e borg_passphrase=<strong-passphrase>
#
#   SMB mounts (haven-data Storage Box, media + docs sub-accounts) -
#   subaccounts don't support NFS, only SMB/CIFS + SSH. Pass at runtime
#   (share name = subaccount username itself, e.g. host u604953-sub2.your-storagebox.de,
#   share u604953-sub2). Each mount is independently enabled by whether its
#   own password is provided:
#       -e storagebox_data_host=<uXXXXXX.your-storagebox.de> \
#       -e storagebox_data_media_password=<media-subaccount-password> \
#       -e storagebox_data_docs_password=<docs-subaccount-password>
#
#   Portainer Edge Agent (Kubernetes) — after creating the "Forge" environment
#   in Portainer (Environments > Add environment > Kubernetes > Edge Agent):
#     ansible-playbook forge-init.yml \
#       --private-key ~/.ssh/haven_ed25519 \
#       -e forge_host=<public_ip> \
#       -e configure_portainer_agent=true \
#       -e portainer_edge_id=<edge-id> \
#       -e portainer_edge_key=<edge-key>
# =============================================================================

- name: Forge — one-time initialisation
  hosts: all
  remote_user: root
  gather_facts: true

  vars_files:
    - vars/main.yml

  tasks:
    # =========================================================================
    # System baseline
    # =========================================================================

    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        cache_valid_time: 0

    - name: Install system tools
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - gnupg
          - ca-certificates
          - apt-transport-https
          - lsb-release
          - unattended-upgrades
          - apt-listchanges
          - borgbackup
          - sshpass
          - htop
          - ncdu
          - fail2ban
          - jq
          - cifs-utils # required for Storage Box SMB mounts (subaccounts don't support NFS)
          - open-iscsi # required for k3s iSCSI storage support
        state: present

    - name: Set timezone to {{ haven_timezone }}
      community.general.timezone:
        name: "{{ haven_timezone }}"

    # =========================================================================
    # Unattended security upgrades
    # =========================================================================

    - name: Configure unattended-upgrades (security only, no auto-reboot)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: "0644"
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}-security";
          };
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::MinimalSteps "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";

    - name: Enable unattended-upgrades timer
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    # =========================================================================
    # k3s — single-node server
    # =========================================================================

    - name: Check if k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install k3s (Traefik enabled — Forge terminates its own TLS via cert-manager, independent of Hearth's Caddy)
      ansible.builtin.shell:
        cmd: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --write-kubeconfig-mode=644" sh -
        executable: /bin/bash
      when: not k3s_binary.stat.exists
      changed_when: true

    - name: Enable and start k3s
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Wait for k3s node to be Ready
      ansible.builtin.command:
        cmd: kubectl get node --no-headers
      register: k3s_node_status
      until: "'Ready' in k3s_node_status.stdout"
      retries: 30
      delay: 10
      changed_when: false

    # This server was originally provisioned when this playbook still passed
    # `--disable traefik` to the k3s installer (a stale assumption, carried
    # over from an older archive, that Caddy-on-Hearth would proxy to Forge
    # instead). That flag was later removed above, but the "Install k3s" task
    # is gated on the binary not already existing, so an already-provisioned
    # server never picks up exec-arg changes on its own. Catch up here,
    # independently of that gate: re-running k3s's official install script
    # rewrites /etc/systemd/system/k3s.service with the current exec args and
    # is safe/idempotent to re-run — once Traefik is actually present this
    # whole block is a no-op on every future run.
    - name: Check if Traefik is deployed
      ansible.builtin.command:
        cmd: kubectl get deployment traefik -n kube-system
      register: traefik_check
      failed_when: false
      changed_when: false

    - name: Re-run k3s install to enable Traefik (was disabled when this server was first provisioned)
      ansible.builtin.shell:
        cmd: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --write-kubeconfig-mode=644" sh -
        executable: /bin/bash
      when: traefik_check.rc != 0
      changed_when: true

    - name: Restart k3s to apply the corrected exec args
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when: traefik_check.rc != 0

    - name: Wait for k3s node to be Ready again after restart
      ansible.builtin.command:
        cmd: kubectl get node --no-headers
      register: k3s_node_status_after_traefik_fix
      until: "'Ready' in k3s_node_status_after_traefik_fix.stdout"
      retries: 30
      delay: 10
      changed_when: false
      when: traefik_check.rc != 0

    - name: Wait for Traefik deployment to come up
      ansible.builtin.command:
        cmd: kubectl get deployment traefik -n kube-system
      register: traefik_wait
      until: traefik_wait.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      when: traefik_check.rc != 0

    # =========================================================================
    # Portainer Edge Agent — registers Forge's k3s cluster as a Kubernetes
    # environment in the existing Hearth Portainer instance. Edge Agent mode:
    # the agent polls OUT to Portainer over HTTPS, so no inbound port/firewall
    # rule is needed on Forge (matches its default-deny-inbound firewall
    # model already used for BorgBackup/SMB). Edge ID/key come from
    # Portainer's own "Add environment > Kubernetes > Edge Agent" wizard —
    # a one-time registration credential, not something Ansible generates.
    # =========================================================================

    - name: Check if Portainer Edge Agent is already installed
      ansible.builtin.command:
        cmd: kubectl get deployment portainer-agent -n portainer
      register: portainer_agent_check
      failed_when: false
      changed_when: false
      when: configure_portainer_agent | bool

    - name: Install Portainer Edge Agent (Kubernetes)
      ansible.builtin.shell:
        cmd: >
          curl -sfL https://downloads.portainer.io/ee2-39/portainer-edge-agent-setup.sh |
          bash -s -- "{{ portainer_edge_id }}" "{{ portainer_edge_key }}" "1" "" ""
        executable: /bin/bash
      when: >
        configure_portainer_agent | bool and
        portainer_edge_id | default('') | length > 0 and
        portainer_edge_key | default('') | length > 0 and
        portainer_agent_check.rc != 0
      changed_when: true

    # =========================================================================
    # haven service user
    # =========================================================================

    - name: Create haven group
      ansible.builtin.group:
        name: "{{ haven_group }}"
        system: true

    - name: Create haven user
      ansible.builtin.user:
        name: "{{ haven_user }}"
        group: "{{ haven_group }}"
        home: "{{ haven_install_path }}"
        create_home: false
        system: true
        shell: /bin/bash

    # =========================================================================
    # Directory structure
    # =========================================================================

    - name: Create haven directory tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ haven_user }}"
        group: "{{ haven_group }}"
        mode: "0750"
      loop:
        - "{{ haven_install_path }}"
        - "{{ haven_install_path }}/var/data"
        - "{{ haven_install_path }}/var/logs"
        - "{{ haven_install_path }}/.ssh"

    - name: Set .ssh permissions
      ansible.builtin.file:
        path: "{{ haven_install_path }}/.ssh"
        state: directory
        owner: "{{ haven_user }}"
        group: "{{ haven_group }}"
        mode: "0700"

    # Lazy-unmount any stale/broken mounts left at these paths from a
    # previous failed attempt (e.g. an NFS mount that timed out
    # mid-registration). The kernel keeps a dead mount entry that makes even
    # a plain stat()/mkdir on the path fail with "[Errno 112] Host is down"
    # until it's cleared — seen on this exact path after an earlier NFS
    # attempt (subaccounts don't support NFS, see below). "-l" detaches
    # immediately without needing the remote host reachable; ignore errors
    # since it's a no-op when nothing is actually mounted.
    - name: Force-unmount any stale haven-data Storage Box mounts
      ansible.builtin.command:
        cmd: umount -l {{ item }}
      loop:
        - /mnt/haven-data-media
        - /mnt/haven-data-docs
      register: force_unmount
      changed_when: force_unmount.rc == 0
      failed_when: false

    - name: Create haven-data Storage Box mount points
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /mnt/haven-data-media
        - /mnt/haven-data-docs

    # =========================================================================
    # Storage Box SMB mounts (haven-data — media + docs sub-accounts)
    # =========================================================================
    # Hetzner Storage Box subaccounts don't support NFS at all (NFS is only
    # available on the top-level Storage Box, and even then it's IP-allowlisted
    # rather than password-based). SMB/CIFS is what subaccounts actually offer.
    # Share name equals the subaccount username itself (confirmed via Hetzner
    # Robot's own connection details, e.g. \\u604953-sub2.your-storagebox.de\u604953-sub2).
    # Two independent shares on the SAME haven-data box — media (Immich
    # only) and docs (Nextcloud + Kavita + Jellyfin) — each mounted only
    # when its own password is provided.

    - name: Write SMB credentials file (media share)
      ansible.builtin.copy:
        dest: "{{ haven_install_path }}/.smbcredentials-media"
        owner: root
        group: root
        mode: "0600"
        content: |
          username={{ storagebox_data_media_subaccount }}
          password={{ storagebox_data_media_password | default('') }}
      when: storagebox_data_media_password | default('') | length > 0
      no_log: true

    - name: Mount Storage Box SMB share (media library)
      ansible.posix.mount:
        path: /mnt/haven-data-media
        src: "//{{ storagebox_data_host }}/{{ storagebox_data_media_subaccount }}"
        fstype: cifs
        opts: "credentials={{ haven_install_path }}/.smbcredentials-media,uid=0,gid=0,_netdev,noatime,vers=3.0"
        state: mounted
      when: storagebox_data_media_password | default('') | length > 0

    - name: Write SMB credentials file (docs share)
      ansible.builtin.copy:
        dest: "{{ haven_install_path }}/.smbcredentials-docs"
        owner: root
        group: root
        mode: "0600"
        content: |
          username={{ storagebox_data_docs_subaccount }}
          password={{ storagebox_data_docs_password | default('') }}
      when: storagebox_data_docs_password | default('') | length > 0
      no_log: true

    - name: Mount Storage Box SMB share (docs library)
      ansible.posix.mount:
        path: /mnt/haven-data-docs
        src: "//{{ storagebox_data_host }}/{{ storagebox_data_docs_subaccount }}"
        fstype: cifs
        opts: "credentials={{ haven_install_path }}/.smbcredentials-docs,uid=0,gid=0,_netdev,noatime,vers=3.0"
        state: mounted
      when: storagebox_data_docs_password | default('') | length > 0

    # =========================================================================
    # SSH hardening
    # =========================================================================

    - name: Harden SSH — disable password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
      notify: Restart sshd

    - name: Harden SSH — disable empty passwords
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitEmptyPasswords"
        line: "PermitEmptyPasswords no"
      notify: Restart sshd

    - name: Harden SSH — root key-only (no password login)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin prohibit-password"
      notify: Restart sshd

    # =========================================================================
    # BorgBackup SSH key (haven-backup Storage Box, forge-backup sub-account)
    # =========================================================================
    # Step 1: generate the key (always runs).
    # Step 2: user adds the printed public key to the Storage Box sub-account
    #         in Hetzner Robot, then re-runs with configure_borg=true.

    - name: Generate BorgBackup SSH key for haven user
      community.crypto.openssh_keypair:
        path: "{{ haven_install_path }}/.ssh/borg_ed25519"
        type: ed25519
        comment: "haven-borg@forge"
        owner: "{{ haven_user }}"
        group: "{{ haven_group }}"
        mode: "0600"
      register: borg_key

    - name: Show BorgBackup public key (authorise this on the Storage Box)
      ansible.builtin.debug:
        msg: |
          ============================================================
          BorgBackup public key — add to Storage Box sub-account:

          {{ borg_key.public_key }}

          The key will be uploaded automatically if configure_borg=true
          and storagebox_backup_password is provided. Otherwise, upload manually:

            cat /opt/haven/.ssh/borg_ed25519.pub | \
              ssh -p23 {{ storagebox_backup_subaccount }}@{{ storagebox_backup_host }} install-ssh-key
          ============================================================
      when: storagebox_backup_host is defined and storagebox_backup_subaccount is defined

    # =========================================================================
    # BorgBackup repository init (Step 2 — only when configure_borg=true)
    # =========================================================================

    - name: Upload SSH key to Storage Box via install-ssh-key
      ansible.builtin.shell:
        cmd: |
          cat {{ haven_install_path }}/.ssh/borg_ed25519.pub | \
            sshpass -p "{{ storagebox_backup_password }}" ssh -p 23 \
            -o StrictHostKeyChecking=no \
            {{ storagebox_backup_subaccount }}@{{ storagebox_backup_host }} \
            install-ssh-key
        executable: /bin/bash
      when: configure_borg | bool and storagebox_backup_password | default('') | length > 0
      register: ssh_key_upload
      changed_when: true
      failed_when: false
      no_log: true

    - name: Fail if SSH key upload failed
      ansible.builtin.fail:
        msg: |
          SSH key upload to Storage Box failed (exit code {{ ssh_key_upload.rc }}).
          Stderr: {{ ssh_key_upload.stderr | default('no output') }}
          Stdout: {{ ssh_key_upload.stdout | default('no output') }}

          Verify:
          1. The Storage Box password is correct
          2. Sub-account username is correct: {{ storagebox_backup_subaccount }}
          3. Storage Box hostname is correct: {{ storagebox_backup_host }}
          4. External reachability is enabled on the Storage Box
      when: configure_borg | bool and storagebox_backup_password | default('') | length > 0 and ssh_key_upload.rc != 0

    - name: Scan Storage Box host key
      ansible.builtin.shell:
        cmd: |
          if ! grep -q '{{ storagebox_backup_host }}' {{ haven_install_path }}/.ssh/known_hosts 2>/dev/null; then
            ssh-keyscan -t ed25519 -p 23 {{ storagebox_backup_host }} >> {{ haven_install_path }}/.ssh/known_hosts
            echo "CHANGED"
          fi
          chown {{ haven_user }}:{{ haven_group }} {{ haven_install_path }}/.ssh/known_hosts
          chmod 644 {{ haven_install_path }}/.ssh/known_hosts
      register: keyscan_result
      changed_when: "'CHANGED' in keyscan_result.stdout"
      when: configure_borg | bool

    # Pipelining must be disabled for become_user tasks — Ansible's pipelining
    # sends module code over stdin through the become mechanism, which can break
    # when switching to a non-root user (UNREACHABLE error).
    - name: Test SSH connectivity to Storage Box (port 23)
      ansible.builtin.command:
        cmd: ssh -i {{ haven_install_path }}/.ssh/borg_ed25519 -p 23 -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o BatchMode=yes {{ storagebox_backup_subaccount }}@{{ storagebox_backup_host }} ls
      become: true
      become_user: "{{ haven_user }}"
      vars:
        ansible_ssh_pipelining: false
      register: ssh_test
      changed_when: false
      failed_when: false
      timeout: 30
      when: configure_borg | bool

    - name: Fail if Storage Box is not reachable
      ansible.builtin.fail:
        msg: |
          Cannot reach Storage Box via SSH on port 23.
          Host: {{ storagebox_backup_host }}
          User: {{ storagebox_backup_subaccount }}
          Return code: {{ ssh_test.rc }}
          Stderr: {{ ssh_test.stderr | default('') }}

          Checklist:
          1. Hetzner Robot → Storage Box → External reachability: ENABLED
          2. Sub-account → SSH: ENABLED
          3. Sub-account → SSH Keys: public key authorised
          4. Hetzner Cloud Firewall → Outbound TCP port 23: ALLOWED
      when: configure_borg | bool and ssh_test.rc == 255

    - name: Check if BorgBackup repo already exists
      ansible.builtin.command:
        cmd: borg info "{{ storagebox_backup_subaccount }}@{{ storagebox_backup_host }}:./forge"
      environment:
        BORG_PASSPHRASE: "{{ borg_passphrase | default('') }}"
        BORG_RSH: "ssh -i {{ haven_install_path }}/.ssh/borg_ed25519 -p 23 -o StrictHostKeyChecking=yes -o ConnectTimeout=30"
      become: true
      become_user: "{{ haven_user }}"
      vars:
        ansible_ssh_pipelining: false
      register: borg_info
      changed_when: false
      failed_when: false
      when: configure_borg | bool

    - name: Initialise BorgBackup repository (repokey-blake2 encryption)
      ansible.builtin.command:
        cmd: borg init --encryption=repokey-blake2 "{{ storagebox_backup_subaccount }}@{{ storagebox_backup_host }}:./forge"
      environment:
        BORG_PASSPHRASE: "{{ borg_passphrase | default('') }}"
        BORG_RSH: "ssh -i {{ haven_install_path }}/.ssh/borg_ed25519 -p 23 -o StrictHostKeyChecking=yes -o ConnectTimeout=30"
      become: true
      become_user: "{{ haven_user }}"
      vars:
        ansible_ssh_pipelining: false
      register: borg_init
      # borg_info can fail (rc != 0) for reasons other than "repo doesn't
      # exist" — e.g. the passphrase changed since the repo was created,
      # which makes `borg info` unable to unlock it even though the repo
      # is physically there. Rely on borg init's own idempotency signal
      # ("repository already exists") instead of failing in that case.
      failed_when: borg_init.rc != 0 and 'repository already exists' not in borg_init.stderr
      changed_when: borg_init.rc == 0
      when: configure_borg | bool and borg_info.rc != 0

    - name: Export and display BorgBackup repokey (store this in Vaultwarden!)
      ansible.builtin.command:
        cmd: borg key export "{{ storagebox_backup_subaccount }}@{{ storagebox_backup_host }}:./forge" -
      environment:
        BORG_PASSPHRASE: "{{ borg_passphrase | default('') }}"
        BORG_RSH: "ssh -i {{ haven_install_path }}/.ssh/borg_ed25519 -p 23 -o StrictHostKeyChecking=yes -o ConnectTimeout=30"
      become: true
      become_user: "{{ haven_user }}"
      vars:
        ansible_ssh_pipelining: false
      register: borg_key_export
      changed_when: false
      when: configure_borg | bool

    - name: Show BorgBackup repokey (save this in Vaultwarden immediately)
      ansible.builtin.debug:
        msg: |
          ============================================================
          BORG REPOKEY — store this in Vaultwarden under "BorgBackup Forge":

          {{ borg_key_export.stdout }}

          Without this key + the passphrase, backups cannot be restored.
          ============================================================
      when: configure_borg | bool

  # ===========================================================================
  # Handlers
  # ===========================================================================

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: ssh
        state: restarted

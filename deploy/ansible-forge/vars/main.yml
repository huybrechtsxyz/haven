# =============================================================================
# Shared, non-sensitive configuration variables for the Forge Ansible
# playbooks (forge-init.yml; forge-config.yml / forge-deploy.yml to follow).
#
# Sensitive values (Storage Box credentials, Borg passphrase) are passed via
# --extra-vars / -e @file at run time and are never committed here.
# =============================================================================

# haven service account (same convention as Hearth, even though Forge's
# workloads run under k3s rather than docker compose)
haven_user: haven
haven_group: haven
haven_install_path: /opt/haven

# Server timezone
haven_timezone: Europe/Brussels

# =============================================================================
# BorgBackup — haven-backup Storage Box, forge-backup sub-account
# =============================================================================
# Set to true only after the borg SSH key has been authorised on the Storage
# Box sub-account (forge-init Step 2) and the repo has been initialised.
configure_borg: false

# haven-backup Storage Box connection details — passed via --extra-vars at
# run time. Password is never declared here — always via -e.
storagebox_backup_host: ""
storagebox_backup_subaccount: forge-backup

# =============================================================================
# Storage Box SMB mounts — haven-data Storage Box (media + docs sub-accounts)
# =============================================================================
# A DIFFERENT physical Storage Box from haven-backup above — live app data,
# not backups. Each mount (media, docs) is independently enabled by whether
# its own password is provided via --extra-vars at run time.
storagebox_data_host: ""
storagebox_data_media_subaccount: media
storagebox_data_docs_subaccount: docs

# =============================================================================
# Portainer Kubernetes Edge Agent
# =============================================================================
# Set to true only after creating the "Forge" environment in Portainer
# (Environments > Add environment > Kubernetes > Edge Agent) and obtaining
# its edge ID/key from the setup wizard.
configure_portainer_agent: false

# Edge ID/key — passed via --extra-vars at run time (never committed here).
portainer_edge_id: ""
portainer_edge_key: ""

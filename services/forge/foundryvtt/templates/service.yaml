apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}"
  labels:
    app: "{{ .Release.Name }}"
spec:
  type: ClusterIP
  selector:
    app: "{{ .Release.Name }}"
  ports:
    # Hardcoded (not templated) — see deployment.yaml's comment; 30000 is
    # Foundry's fixed upstream port.
    - port: 30000
      targetPort: 30000

{{- if .Values.sso.enabled }}
# Traefik forwardAuth middleware — delegates authentication to Authentik's
# outpost before any request reaches FoundryVTT. Same pattern as
# services/forge/firefly/templates/middleware.yaml — see that file, its
# values.yaml `outpost:` comment, and docs/services/foundryvtt.md's SSO
# section for the full cross-host routing writeup (Authentik runs on
# Hearth, this app runs on Forge).
#
# Name is release-specific ("{{ .Release.Name }}-authentik-forwardauth"),
# NOT the bare "authentik-forwardauth" firefly's own chart uses — copying
# firefly-importer's fix for a real Helm ownership-conflict error hit when
# two charts in the same namespace both tried to own that literal name
# (2026-09-16). foundryvtt lives in its own "gaming" namespace so this
# specific collision can't happen here, but keeping the same convention
# avoids relying on that.
#
# address points at THIS APP'S OWN domain (not {{ .Values.outpost.authentikHost }}) —
# required by Authentik's "forward auth (single application)" mode so the
# session cookie it sets is scoped correctly (see ingress-outpost.yaml for
# why that path is proxied cross-host to the real outpost).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ .Release.Name }}-authentik-forwardauth"
spec:
  forwardAuth:
    address: "https://{{ .Values.ingress.host }}/outpost.goauthentik.io/auth/traefik"
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  # Recreate, not RollingUpdate — single SQLite file (yuvomi.db) on a
  # ReadWriteOnce PVC with forward-only migrations. Same reasoning as
  # pgadmin/deployment.yaml: a rolling update would briefly run old+new pods
  # against the same file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: yuvomi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
          # Yuvomi ships its own /health endpoint (used by the project's own
          # docker-compose healthcheck) — reused here as k8s probes.
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
            - name: documents
              mountPath: /documents
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: backups
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-backups
        - name: documents
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-documents

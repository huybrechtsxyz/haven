apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .Release.Name }}"
spec:
  schedule: "{{ .Values.schedule }}"
  # Hardcoded (not templated): VS Code's YAML formatter repeatedly mangles a
  # bare Go-template expression on an unquoted integer field by inserting a
  # stray space inside each brace pair (turning double braces into two
  # separate single braces), which breaks Helm parsing (flow-mapping
  # ambiguity). These two knobs are rarely-changed housekeeping values, so
  # hardcode them instead of fighting the formatter.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: "{{ .Release.Name }}"
          restartPolicy: Never
          containers:
            - name: files-scan
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command:
                - kubectl
                - exec
                - "deploy/{{ .Values.target.deployment }}"
                - "-n"
                - "{{ .Values.target.namespace }}"
                - "-c"
                - "{{ .Values.target.container }}"
                - "--"
                - php
                - occ
                - files:scan
                - --all

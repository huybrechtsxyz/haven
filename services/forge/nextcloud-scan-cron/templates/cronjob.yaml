apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .Release.Name }}"
spec:
  schedule: "{{ .Values.schedule }}"
  # Hardcoded (not templated): VS Code's YAML formatter repeatedly mangles a
  # bare `{{ .Values.x }}` on an unquoted integer field into `{ { .Values.x } }`
  # on save (flow-mapping ambiguity), which breaks Helm parsing. These two
  # knobs are rarely-changed housekeeping values, so hardcode them instead of
  # fighting the formatter.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: "{{ .Release.Name }}"
          restartPolicy: Never
          containers:
            - name: files-scan
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command:
                - kubectl
                - exec
                - "deploy/{{ .Values.target.deployment }}"
                - "-n"
                - "{{ .Values.target.namespace }}"
                - "-c"
                - "{{ .Values.target.container }}"
                - "--"
                - php
                - occ
                - files:scan
                - --all

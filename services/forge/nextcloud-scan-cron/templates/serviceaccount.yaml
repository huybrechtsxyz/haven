apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Release.Name }}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ .Release.Name }}"
rules:
  # `kubectl exec deploy/X` needs: get on the Deployment (to resolve its
  # pod), get/list on pods, and create on the pods/exec subresource.
  # Deliberately scoped to exactly these three — no write access to
  # anything else in the namespace.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Release.Name }}"
subjects:
  - kind: ServiceAccount
    name: "{{ .Release.Name }}"
    namespace: "{{ .Values.target.namespace }}"
roleRef:
  kind: Role
  name: "{{ .Release.Name }}"
  apiGroup: rbac.authorization.k8s.io

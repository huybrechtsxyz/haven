# Defaults — override via the strata module's spec.configuration (see
# config/forge/modules/rclone-mount.yaml).
image:
  repository: rclone/rclone
  tag: latest

s3:
  bucket: haven-docs
  endpoint: https://eu-central.your-objectstorage.com
  region: eu-central
  # Real values injected by strata at deploy time — never written here.
  accessKeyId: ""
  secretAccessKey: ""

mount:
  # Path on the Forge HOST (not just inside the pod) where the bucket becomes
  # a normal directory tree — every consuming app (Nextcloud, Kavita, ...)
  # hostPath-mounts a subpath of this same tree.
  hostPath: /mnt/haven-docs
  # rclone VFS cache mode — "writes" caches written data locally until synced,
  # giving apps a consistent view without needing full-file re-downloads on
  # every read. Some caching delay is expected and accepted (per design
  # discussion) — not real-time shared state, just much tighter than two
  # independent S3 clients.
  vfsCacheMode: writes
  dirCacheTime: 30s
  # Subfolders any consuming app expects to already exist in the bucket
  # (e.g. Kavita's "books" library). Created via a real `rclone mkdir` call
  # against the S3 API directly (initContainer, see templates/deployment.yaml)
  # — NOT a plain filesystem mkdir through the FUSE mount. Confirmed
  # (2026-08-28, real CI run): a bare POSIX mkdir(2) on this FUSE mount fails
  # with a raw EIO for a brand-new "directory" that doesn't exist in the S3
  # bucket yet, regardless of whether it's kubelet, a pod, or a plain SSH
  # shell issuing it — this is an rclone/S3-backend limitation, not a
  # kubelet-bind-mount quirk. `rclone mkdir` talks to the S3 API directly
  # (writes the zero-byte directory-marker object) and sidesteps this
  # entirely.
  subfolders:
    - books

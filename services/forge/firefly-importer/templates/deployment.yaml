apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}"
  labels:
    app: "{{ .Release.Name }}"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}"
    spec:
      containers:
        - name: firefly-importer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            # Hardcoded (not templated) — see templates/service.yaml's comment.
            - containerPort: 8080
          env:
            {{- range $key, $value := .Values.env }}
            - name: "{{ $key }}"
              value: "{{ $value }}"
            {{- end }}
          volumeMounts:
            - name: import
              mountPath: /import
      volumes:
        - name: import
          hostPath:
            path: "{{ .Values.importFolder.hostPath }}"
            type: DirectoryOrCreate

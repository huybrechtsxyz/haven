{{- if .Values.sso.enabled }}
# Traefik forwardAuth middleware — delegates authentication to Authentik's
# outpost before any request reaches the Data Importer. Same pattern as
# services/forge/firefly/templates/middleware.yaml — see that file and
# values.yaml's `outpost:` comment for the full cross-host routing writeup
# (Authentik runs on Hearth, this app runs on Forge).
#
# Name is release-specific ("{{ .Release.Name }}-authentik-forwardauth"),
# NOT the bare "authentik-forwardauth" firefly's own chart uses — both
# charts live in the same "finance" namespace, and each app's forwardAuth
# address is host-specific (points at ITS OWN ingress.host), so they can't
# share one Middleware object anyway. Reusing the same object name caused a
# real Helm ownership-conflict error on first deploy: "Middleware
# 'authentik-forwardauth' ... exists and cannot be imported into the current
# release ... current value is 'firefly'" (2026-09-16).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ .Release.Name }}-authentik-forwardauth"
spec:
  forwardAuth:
    address: "https://{{ .Values.ingress.host }}/outpost.goauthentik.io/auth/traefik"
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
{{- end }}

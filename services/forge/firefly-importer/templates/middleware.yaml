{{- if .Values.sso.enabled }}
# Traefik forwardAuth middleware — delegates authentication to Authentik's
# outpost before any request reaches the Data Importer. Same pattern as
# services/forge/firefly/templates/middleware.yaml — see that file and
# values.yaml's `outpost:` comment for the full cross-host routing writeup
# (Authentik runs on Hearth, this app runs on Forge).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
spec:
  forwardAuth:
    address: "https://{{ .Values.ingress.host }}/outpost.goauthentik.io/auth/traefik"
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
{{- end }}

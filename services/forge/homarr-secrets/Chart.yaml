apiVersion: v2
name: homarr-secrets
description: >
  Two Kubernetes Secrets holding Homarr's real credential values (OIDC client
  secret + database encryption key), filled by the strata module from
  `${secret:...}` tokens at deploy time. The official Homarr chart only takes
  these through `envSecrets.*.existingSecret` (a referenced Secret name +
  key), so homarr.yaml points there instead of at a plaintext value.
type: application
version: "1.0.0"

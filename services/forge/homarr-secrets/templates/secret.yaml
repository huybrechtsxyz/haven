# Names match the Homarr chart's own defaults for envSecrets.*.existingSecret
# (auth-oidc-secret / db-secret) so homarr.yaml doesn't need to override them
# — see https://github.com/homarr-labs/charts/blob/main/charts/homarr/values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: homarr-auth-oidc-secret
type: Opaque
stringData:
  # Not actually sensitive (it's the OIDC client_id, visible in every auth
  # redirect), but the chart requires it live in the SAME Secret as the
  # client secret once envSecrets.authOidcCredentials.existingSecret is set
  # — there's no separate plaintext field for it.
  oidc-client-id: "homarr"
  oidc-client-secret: {{ .Values.env.HOMARR_SSO_CLIENT_SECRET | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: homarr-db-secret
type: Opaque
stringData:
  # Homarr's SECRET_ENCRYPTION_KEY — encrypts integration credentials Homarr
  # stores in its own database. Required regardless of DB backend (sqlite or
  # mysql), per the chart's own README secrets table.
  db-encryption-key: {{ .Values.env.HOMARR_DB_ENCRYPTION_KEY | quote }}

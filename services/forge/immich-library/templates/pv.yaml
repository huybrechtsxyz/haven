apiVersion: v1
kind: PersistentVolume
metadata:
  name: { { .Release.Name } }
  labels:
    app: { { .Release.Name } }
spec:
  capacity:
    storage: { { .Values.storage.size } }
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  # No storageClassName — must be "" to statically bind, since there's no
  # dynamic provisioner for this path (it's an SMB/CIFS mount, not local-path).
  storageClassName: ""
  hostPath:
    path: { { .Values.storage.hostPath } }
    type: DirectoryOrCreate

{{- if .Values.sso.enabled }}
# Traefik forwardAuth middleware — delegates authentication to Authentik's
# outpost before any request reaches RPGKeeper. Same pattern as
# services/forge/foundryvtt/templates/middleware.yaml — see that file and
# docs/services/rpgkeeper.md's SSO section for the full cross-host routing
# writeup (Authentik runs on Hearth, this app runs on Forge).
#
# Name is release-specific ("{{ .Release.Name }}-authentik-forwardauth"),
# matching the firefly-importer/foundryvtt convention.
#
# address points at THIS APP'S OWN domain — required by Authentik's
# "forward auth (single application)" mode so the session cookie it sets is
# scoped correctly (see ingress-outpost.yaml for why that path is proxied
# cross-host to the real outpost).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: "{{ .Release.Name }}-authentik-forwardauth"
spec:
  forwardAuth:
    address: "https://{{ .Values.ingress.host }}/outpost.goauthentik.io/auth/traefik"
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}"
  labels:
    app: "{{ .Release.Name }}"
spec:
  type: ClusterIP
  selector:
    app: "{{ .Release.Name }}"
  ports:
    # Hardcoded (not templated) — see deployment.yaml's comment; 5678 is
    # RPGKeeper's fixed upstream port.
    - port: 5678
      targetPort: 5678

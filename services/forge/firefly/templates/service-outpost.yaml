{{- if .Values.sso.enabled }}
# Cross-host bridge: Authentik's embedded outpost lives inside the Authentik
# server container on Hearth (Docker Compose), while this Ingress is served
# by Forge's own Traefik (k3s). A plain ExternalName Service lets Traefik
# proxy the outpost's own path (see ingress-outpost.yaml) over the public
# domain to the real backend, the same way any other upstream would be
# reached. `service.serversscheme: https` tells Traefik to connect out over
# HTTPS (Hearth's Caddy terminates TLS for auth.{{ .Values.outpost.authentikHost }}'s real domain) —
# without it Traefik defaults to plain HTTP for ExternalName backends.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-authentik-outpost
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
spec:
  type: ExternalName
  externalName: {{ .Values.outpost.authentikHost }}
  ports:
    - name: https
      port: 443
      targetPort: 443
{{- end }}

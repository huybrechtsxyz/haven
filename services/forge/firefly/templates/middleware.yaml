{{- if .Values.sso.enabled }}
# Traefik forwardAuth middleware — delegates authentication to Authentik's
# outpost before any request reaches Firefly. See values.yaml's `outpost:`
# comment and ingress-outpost.yaml/service-outpost.yaml for the full
# cross-host routing writeup (Authentik runs on Hearth, this app on Forge).
#
# address points at THIS APP'S OWN domain (not auth.{{ .Values.outpost.authentikHost }}) — required by
# Authentik's "forward auth (single application)" mode so the session cookie
# it sets is scoped correctly (see ingress-outpost.yaml for why that path is
# proxied cross-host to the real outpost).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
spec:
  forwardAuth:
    address: https://{{ .Values.ingress.host }}/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
{{- end }}

# Credentials MUST live under a literal `env:` dict — strata's Helm secret
# substitution only resolves `${TOKEN}` placeholders found inside a dict
# node keyed literally "env" (see Chart.yaml / nextcloud.yaml's module
# comment for the full writeup). Real values injected by strata at deploy
# time — never written here.
env:
  NEXTCLOUD_ADMIN_PASSWORD: ""
  NEXTCLOUD_DB_PASSWORD: ""
  NEXTCLOUD_REDIS_PASSWORD: ""
  NEXTCLOUD_SSO_CLIENT_SECRET: ""
  INFOMANIAK_EMAIL__HOST: ""
  INFOMANIAK_EMAIL__PORT: ""
  INFOMANIAK_EMAIL__USERNAME: ""
  INFOMANIAK_EMAIL__PASSWORD: ""

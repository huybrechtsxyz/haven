# Real values come from the strata module (config/forge/modules/nextcloud-secrets.yaml)
# as `${secret:...}` tokens, resolved at deploy time and handed to Helm on
# stdin — never written here or to the build output.
env:
  NEXTCLOUD_ADMIN_PASSWORD: ""
  NEXTCLOUD_DB_PASSWORD: ""
  NEXTCLOUD_REDIS_PASSWORD: ""
  NEXTCLOUD_SSO_CLIENT_SECRET: ""
  INFOMANIAK_EMAIL__HOST: ""
  INFOMANIAK_EMAIL__PORT: ""
  INFOMANIAK_EMAIL__USERNAME: ""
  INFOMANIAK_EMAIL__PASSWORD: ""

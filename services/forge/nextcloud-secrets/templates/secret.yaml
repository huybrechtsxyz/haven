apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
type: Opaque
stringData:
  # Usernames — NOT secrets (fixed, non-sensitive values), but the official
  # nextcloud chart's existingSecret.usernameKey (default: nextcloud-username
  # / db-username) requires them to live in the SAME Secret as the
  # passwords once existingSecret.enabled is set — there's no way to mix a
  # plaintext username with a secret-sourced password. Hardcoded here
  # (not under .Values.env / ${TOKEN}) since they never change and aren't
  # real credentials — must match nextcloud.yaml's `nextcloud.username: admin`
  # and `externalDatabase.user: nextcloud`.
  nextcloud-username: "admin"
  db-username: "nextcloud"
  nextcloud-password: {{ .Values.env.NEXTCLOUD_ADMIN_PASSWORD | quote }}
  db-password: {{ .Values.env.NEXTCLOUD_DB_PASSWORD | quote }}
  redis-password: {{ .Values.env.NEXTCLOUD_REDIS_PASSWORD | quote }}
  sso-client-secret: {{ .Values.env.NEXTCLOUD_SSO_CLIENT_SECRET | quote }}
apiVersion: v2
name: nextcloud-secrets
description: >
  Single Kubernetes Secret holding Nextcloud's real credential values, which
  the strata module fills from `${secret:...}` tokens at deploy time.
  nextcloud.yaml / nextcloud-redis.yaml reference this Secret via
  existingSecret / secretKeyRef instead of a plaintext value. Created under
  strata v1, which only resolved secrets inside an `env:` dict and so could
  not reach the official chart's own password fields; strata v2 resolves
  tokens anywhere in a chart's values, so this indirection is optional now.
type: application
version: "1.0.0"
